<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>큐브 마이너즈 · 블록섬 벌레 소탕 작전</title>
<meta name="theme-color" content="#7cc6f2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
    :root {
        --ink: #2b3a55;
        --ink2: #5a6b88;
        --panel: rgba(255, 255, 255, 0.94);
        --line: #cfe2f5;
        --accent: #ff9f43;
        --red: #ff6b6b;
        --top: env(safe-area-inset-top, 0px);
        --bot: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: radial-gradient(ellipse at 50% 30%, #bfe6ff 0%, #7cc6f2 55%, #4a8fd0 100%);
        color: var(--ink);
        font-family: "Jua", "Pretendard", system-ui, sans-serif;
        touch-action: none; user-select: none; -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    /* 모바일 세로 화면 기준 프레임 — PC에서도 9:16으로 가운데 표시 */
    #app {
        position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
        width: min(100vw, calc(100dvh * 9 / 16)); overflow: hidden; background: #7cc6f2;
        box-shadow: 0 0 0 1px rgba(255,255,255,.4), 0 20px 60px rgba(20, 50, 90, .35);
    }
    canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .hidden { display: none !important; }
    button { font-family: inherit; color: inherit; cursor: pointer; border: 0; }

    .panel {
        background: var(--panel); border: 3px solid var(--line); border-radius: 18px;
        box-shadow: 0 6px 0 rgba(43, 58, 85, 0.18), 0 12px 30px rgba(20, 50, 90, 0.18);
    }
    .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        padding: 12px 18px; border-radius: 999px; font-size: 18px;
        background: linear-gradient(180deg, #ffd56b 0%, #ff9f43 100%); color: #5a2d00;
        box-shadow: 0 4px 0 #c86a16, 0 6px 14px rgba(200, 106, 22, 0.35);
        transition: transform .08s;
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c86a16; }
    .btn.big { font-size: 22px; padding: 13px 24px; width: 100%; }
    .btn.sub { background: linear-gradient(180deg, #ffffff 0%, #e4f1fd 100%); color: var(--ink); box-shadow: 0 4px 0 #a9c7e6; }
    .btn.sub:active { box-shadow: 0 1px 0 #a9c7e6; }
    .btn:disabled { filter: grayscale(.8); opacity: .55; }

    /* ---------- HUD ---------- */
    #hud { position: absolute; inset: 0; pointer-events: none; }
    #xpbar { position: absolute; top: var(--top); left: 0; right: 0; height: 12px; background: rgba(20, 40, 70, 0.35); }
    #xpfill { height: 100%; width: 0; background: linear-gradient(90deg, #7ff0c8, #4aa3ff); box-shadow: 0 0 8px rgba(120, 220, 255, .8); transition: width .15s; }
    #lvtag { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 0 10px; font-size: 13px; line-height: 18px; }
    #tl { position: absolute; top: calc(var(--top) + 24px); left: 8px; padding: 6px 8px; width: 142px; }
    .hprow { display: flex; align-items: center; gap: 5px; }
    .hprow .heart { color: var(--red); font-size: 16px; }
    .bar { position: relative; flex: 1; height: 15px; border-radius: 999px; background: #e7eef7; overflow: hidden; border: 2px solid #d4e3f2; }
    #hpfill { height: 100%; width: 100%; background: linear-gradient(180deg, #ff9a9a, #ff5a6a); transition: width .12s; }
    #hptext { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 12px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
    #slots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
    .slot { position: relative; width: 27px; height: 27px; border-radius: 8px; background: #eef5fc; border: 2px solid #d4e3f2; display: grid; place-items: center; font-size: 15px; }
    .slot.p { background: #fff6e4; border-color: #f4dfb4; }
    .slot b { position: absolute; right: -3px; bottom: -4px; font-size: 10px; font-weight: normal; background: var(--ink); color: #fff; border-radius: 6px; padding: 0 3px; line-height: 13px; }
    #tc { position: absolute; top: calc(var(--top) + 22px); left: 50%; transform: translateX(-50%); text-align: center; width: 120px; }
    #stageName { font-size: 11px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); white-space: nowrap; }
    #timer { font-size: 30px; line-height: 1.05; color: #fff; text-shadow: 0 2px 0 #2b3a55, 0 0 10px rgba(0,0,0,.35); -webkit-text-stroke: 1px #2b3a55; }
    #timer.warn { color: #ffcf4a; }
    #obj { display: inline-block; margin-top: 3px; font-size: 12px; background: rgba(255,255,255,.92); border-radius: 999px; padding: 1px 8px; border: 2px solid var(--line); white-space: nowrap; }
    #obj.done { background: #d9f7dc; border-color: #9fe0a6; }
    #tr { position: absolute; top: calc(var(--top) + 22px); right: 8px; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
    #trbtns { display: flex; gap: 6px; }
    .iconbtn { pointer-events: auto; width: 36px; height: 36px; border-radius: 11px; background: #fff; border: 2px solid var(--line); font-size: 16px; box-shadow: 0 3px 0 #a9c7e6; }
    #miniWrap { position: relative; width: 104px; height: 104px; border-radius: 50%; background: rgba(255,255,255,.9); border: 3px solid #fff; box-shadow: 0 3px 0 rgba(43,58,85,.25), 0 6px 14px rgba(20,50,90,.25); overflow: hidden; }
    #mini { width: 100%; height: 100%; display: block; }
    .pills { display: flex; gap: 4px; }
    .pill { background: rgba(255,255,255,.94); border: 2px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 13px; text-align: right; white-space: nowrap; }
    #bossbar { position: absolute; top: calc(var(--top) + 172px); left: 50%; transform: translateX(-50%); width: 78%; text-align: center; }
    #bossbar .bname { font-size: 14px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
    #bossbar .bar { height: 13px; border-color: #ffb3d6; }
    #bossfill { height: 100%; width: 100%; background: linear-gradient(180deg, #ff9ad0, #e0458f); }
    #banner {
        position: absolute; left: 50%; bottom: calc(var(--bot) + 80px); transform: translateX(-50%);
        background: linear-gradient(180deg, #fff3c4, #ffd56b); border: 3px solid #e3a33a; border-radius: 16px; padding: 7px 16px; font-size: 18px; color: #6a3a00; white-space: nowrap;
        box-shadow: 0 4px 0 #c86a16; animation: pulse 1s infinite;
    }
    @keyframes pulse { 50% { transform: translateX(-50%) scale(1.05); } }
    #toast {
        position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); font-size: 22px; color: #fff; text-align: center;
        text-shadow: 0 2px 0 #2b3a55, 0 0 12px rgba(0,0,0,.4); -webkit-text-stroke: 1px #2b3a55; opacity: 0; transition: opacity .3s; white-space: nowrap;
    }
    #toast.show { opacity: 1; }
    #podArrow { position: absolute; left: 0; top: 0; width: 52px; height: 52px; margin: -26px 0 0 -26px; display: grid; place-items: center; }
    #podArrow i { display: block; width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 26px solid #ffd84a; filter: drop-shadow(0 2px 0 #c86a16) drop-shadow(0 0 6px rgba(255,220,80,.9)); }
    #podArrow span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 11px; color: #fff; -webkit-text-stroke: .5px #2b3a55; white-space: nowrap; }
    #dmg { position: absolute; inset: 0; overflow: hidden; }
    .dn { position: absolute; left: 0; top: 0; font-size: 15px; color: #fff; -webkit-text-stroke: 1px #2b3a55; text-shadow: 0 2px 0 #2b3a55; white-space: nowrap; will-change: transform, opacity; }
    .dn.crit { color: #ffd84a; font-size: 19px; }
    .dn.hurt { color: #ff6b6b; font-size: 19px; }
    .dn.heal { color: #7cf09a; }
    .dn.arm { color: #b8c4d4; font-size: 13px; }
    .dn.alert { color: #ffd84a; font-size: 26px; }
    #hurt { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(255, 60, 80, .6) 100%); opacity: 0; transition: opacity .25s; }

    #joy { position: absolute; width: 116px; height: 116px; margin: -58px 0 0 -58px; border-radius: 50%; background: rgba(255,255,255,.22); border: 3px solid rgba(255,255,255,.6); pointer-events: none; }
    #knob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 3px 0 rgba(43,58,85,.25); }

    /* ---------- 화면들 ---------- */
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(var(--top) + 14px) 12px calc(var(--bot) + 14px); gap: 12px; background: rgba(40, 80, 130, 0.35); overflow-y: auto; }
    #title { background: transparent; justify-content: space-between; }
    .logo { text-align: center; margin-top: 3vh; }
    .logo-main { font-size: clamp(40px, 13vw, 64px); line-height: 1; color: #fff; -webkit-text-stroke: 3px #2b6cb0; text-shadow: 0 6px 0 #2b6cb0, 0 10px 18px rgba(20, 50, 90, .35); letter-spacing: 2px; }
    .logo-main span { color: #ffd84a; }
    .logo-sub { margin-top: 10px; display: inline-block; background: #fff; border: 3px solid var(--line); border-radius: 999px; padding: 4px 14px; font-size: 16px; }
    .menu { width: 100%; padding: 12px; display: flex; flex-direction: column; gap: 9px; }
    .sec-title { font-size: 15px; color: var(--ink2); text-align: center; }
    .classgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .cls { background: #f3f8fe; border: 3px solid #d9e8f6; border-radius: 14px; padding: 7px 2px; text-align: center; transition: transform .1s; }
    .cls.sel { background: #fff7df; border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 4px 0 #f0c070; }
    .cls .ci { font-size: 22px; }
    .cls .cn { font-size: 14px; }
    .cls .cw { font-size: 11px; color: var(--ink2); }
    #clsDesc { text-align: center; font-size: 13px; color: var(--ink2); min-height: 18px; }
    .row { display: flex; gap: 8px; }
    .row .btn { flex: 1; }
    .bank { background: #fff3c4; border-radius: 999px; padding: 0 8px; font-size: 13px; }
    .hint { text-align: center; font-size: 11px; color: var(--ink2); line-height: 1.5; }
    .dlg { width: 100%; padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; max-height: 100%; }
    .dlg h2 { margin: 0; text-align: center; font-weight: normal; font-size: 27px; }
    .dlg .sub2 { text-align: center; color: var(--ink2); font-size: 14px; margin-top: -4px; }
    .cards { display: flex; flex-direction: column; gap: 9px; overflow-y: auto; }
    .card {
        display: flex; align-items: center; gap: 11px; text-align: left; width: 100%;
        background: linear-gradient(180deg, #ffffff, #f0f7ff); border: 3px solid #d4e5f6; border-radius: 16px; padding: 9px 11px;
        box-shadow: 0 4px 0 #b9d3ec; transition: transform .08s;
    }
    .card:active { transform: translateY(3px); box-shadow: 0 1px 0 #b9d3ec; }
    .card:disabled { opacity: .5; filter: grayscale(.6); }
    .card .ico { flex: none; width: 48px; height: 48px; border-radius: 14px; background: #e6f2fd; display: grid; place-items: center; font-size: 26px; }
    .card.pas .ico { background: #fff1d6; }
    .card .nm { font-size: 17px; }
    .card .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #e6f2fd; color: #2f6fb5; margin-left: 4px; vertical-align: 2px; }
    .card .tag.new { background: #ffe1e1; color: #d63c3c; }
    .card .ds { font-size: 13px; color: var(--ink2); margin-top: 2px; }
    .card .price { margin-left: auto; flex: none; background: #fff3c4; border: 2px solid #f4d98a; border-radius: 999px; padding: 2px 9px; font-size: 14px; color: #8a5a00; }
    .goldline { text-align: center; font-size: 17px; }
    .goldline b { font-weight: normal; color: #c87a00; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .stats div { background: #f3f8fe; border-radius: 12px; padding: 7px 9px; font-size: 14px; display: flex; justify-content: space-between; gap: 4px; }
    .stats div.wide { grid-column: span 2; background: #fff6dc; }
    .stats b { font-weight: normal; color: var(--accent); }
    .shoplist { display: flex; flex-direction: column; gap: 7px; overflow-y: auto; }
    .shopitem { display: flex; align-items: center; gap: 9px; background: #f3f8fe; border-radius: 14px; padding: 7px 9px; }
    .shopitem .ico { font-size: 24px; width: 34px; text-align: center; }
    .shopitem .nm { font-size: 16px; }
    .shopitem .ds { font-size: 12px; color: var(--ink2); }
    .pips { display: flex; gap: 3px; margin-top: 3px; }
    .pips i { width: 13px; height: 6px; border-radius: 3px; background: #d4e3f2; }
    .pips i.on { background: var(--accent); }
    .shopitem .btn { margin-left: auto; padding: 7px 11px; font-size: 14px; white-space: nowrap; }
    .build { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
</style>
</head>
<body>
<div id="app">
<canvas id="c"></canvas>

<div id="hud" class="hidden">
    <div id="xpbar"><div id="xpfill"></div><div id="lvtag">Lv 1</div></div>
    <div id="tl" class="panel">
        <div class="hprow"><span class="heart">❤</span><div class="bar"><div id="hpfill"></div><span id="hptext">100</span></div></div>
        <div id="slots"></div>
    </div>
    <div id="tc"><div id="stageName"></div><div id="timer">04:00</div><div id="obj"></div></div>
    <div id="tr">
        <div id="trbtns"><button id="btnSnd2" class="iconbtn" aria-label="소리">🔊</button><button id="btnPause" class="iconbtn" aria-label="일시정지">⏸</button></div>
        <div id="miniWrap"><canvas id="mini" width="208" height="208"></canvas></div>
        <div class="pills"><div class="pill">🪙 <span id="gold">0</span></div><div class="pill">💀 <span id="kills">0</span></div></div>
    </div>
    <div id="bossbar" class="hidden"><div class="bname">👑 여왕 벌레</div><div class="bar"><div id="bossfill"></div></div></div>
    <div id="banner" class="hidden"></div>
    <div id="toast"></div>
    <div id="podArrow" class="hidden"><i></i><span></span></div>
    <div id="dmg"></div>
    <div id="hurt"></div>
</div>
<div id="joy" class="hidden"><div id="knob"></div></div>

<div id="title" class="screen">
    <div class="logo">
        <div class="logo-main">큐브<br><span>마이너즈</span></div>
        <div class="logo-sub">⛏️ 블록섬 벌레 소탕 작전</div>
    </div>
    <div class="panel menu">
        <div class="sec-title">출격할 대원을 고르세요</div>
        <div id="classes" class="classgrid"></div>
        <div id="clsDesc"></div>
        <button id="btnStart" class="btn big">⛏️ 출격하기</button>
        <div class="row">
            <button id="btnShop" class="btn sub">🛒 강화 상점 <span class="bank">🏅 <b id="bank">0</b></span></button>
            <button id="btnSnd" class="btn sub" style="flex:0 0 60px">🔊</button>
            <button id="btnDebug" class="btn sub" style="flex:0 0 60px" aria-label="디버그">🛠</button>
        </div>
        <div class="hint">이동: WASD·방향키 / 화면 드래그 · 보이는 적에게 자동 사격<br>블록 쪽으로 밀면 드릴 채굴 · 4분 버티고 탈출선 탑승!<br>최고 기록: <span id="best">-</span></div>
    </div>
</div>

<div id="shop" class="screen hidden">
    <div class="panel dlg">
        <h2>🛒 강화 상점</h2>
        <div class="sub2">작전에서 받은 메달로 영구 능력을 올려요 · 보유 🏅 <span id="bank2">0</span></div>
        <div id="shoplist" class="shoplist"></div>
        <button id="btnShopBack" class="btn sub">돌아가기</button>
    </div>
</div>

<div id="debug" class="screen hidden">
    <div class="panel dlg">
        <h2>🛠 디버그</h2>
        <div class="sub2">테스트용 기능이에요</div>
        <button id="btnFree" class="btn sub"></button>
        <button id="btnMedal" class="btn sub">🏅 메달 +500</button>
        <button id="btnReset" class="btn sub">🗑️ 계정 리셋</button>
        <button id="btnDebugBack" class="btn big">돌아가기</button>
    </div>
</div>

<div id="levelup" class="screen hidden">
    <div class="panel dlg">
        <h2>✨ 레벨 업!</h2>
        <div class="sub2" id="luSub">강화할 장비를 하나 고르세요</div>
        <div id="luCards" class="cards"></div>
        <button id="btnReroll" class="btn sub">🎲 다시 뽑기 (<span id="rerollN">0</span>)</button>
    </div>
</div>

<div id="pause" class="screen hidden">
    <div class="panel dlg">
        <h2>⏸ 일시정지</h2>
        <div id="pauseBuild" class="build"></div>
        <div id="pauseStats" class="stats"></div>
        <button id="btnResume" class="btn big">계속하기</button>
        <button id="btnQuit" class="btn sub">작전 포기 (메달은 받아요)</button>
    </div>
</div>

<div id="supply" class="screen hidden">
    <div class="panel dlg">
        <h2 id="supTitle">🎉 스테이지 클리어!</h2>
        <div class="sub2" id="supSub"></div>
        <div class="goldline">보유 골드 🪙 <b id="runGold">0</b></div>
        <div id="supCards" class="cards"></div>
        <button id="btnNext" class="btn big">🚀 다음 섬으로 출발</button>
    </div>
</div>

<div id="result" class="screen hidden">
    <div class="panel dlg">
        <h2 id="resTitle">작전 실패</h2>
        <div class="sub2" id="resSub"></div>
        <div id="resStats" class="stats"></div>
        <div id="resBuild" class="build"></div>
        <button id="btnAgain" class="btn big">다시 출격</button>
        <button id="btnHome" class="btn sub">타이틀로</button>
    </div>
</div>
</div>

<script type="importmap">

<script type="module">
/* =========================================================================
   큐브 마이너즈 — 쿼터뷰 3D 복셀 섬을 누비는 채굴 서바이버
   이동만 하면 보이는 적에게 무기가 자동 발사. 블록으로 밀면 드릴 채굴.
   섬마다 4분을 버티고 탈출선에 올라 다음 섬으로. 4개의 섬을 돌파하면 승리.
   골드(인게임) → 섬 사이 보급 상점 / 메달(아웃게임) → 작전 종료 시 정산
   ========================================================================= */
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const isTouch = matchMedia('(pointer: coarse)').matches;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function pickW(list) { let s = 0; for (const x of list) s += x[1]; let r = Math.random() * s; for (const x of list) { r -= x[1]; if (r <= 0) return x[0]; } return list[0][0]; }
function fmtTime(t) { t = Math.max(0, Math.ceil(t)); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); }
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
const _col = new THREE.Color();
const colCache = new Map();
function lin(hex) { let c = colCache.get(hex); if (!c) { _col.set(hex); c = [_col.r, _col.g, _col.b]; colCache.set(hex, c); } return c; }
function hexRGB(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

function wDesc(id, lv) {

    const a = WEAPONS[id].lv[lv - 1], b = WEAPONS[id].lv[lv], out = [];
    for (const k in b) {

function genChoices() {
    const opts = [];

    if (run.weapons.length < MAX_SLOTS) for (const id in WEAPONS) if (!run.weapons.find(w => w.id === id)) opts.push({ t: 'w', id, lv: 0, wt: 1 });
    const pc = Object.keys(run.passives).length;
    for (const id in PASSIVES) { const l = run.passives[id] || 0; if (l ? l < MAX_PLV : pc < MAX_SLOTS) opts.push({ t: 'p', id, lv: l, wt: l ? 1.2 : .9 }); }
    const res = [];

}

$('btnFree').addEventListener('click', () => { save.free = !save.free; persist(); sfx('click'); renderDebug(); });
$('btnMedal').addEventListener('click', () => { save.medal += 500; persist(); sfx('chest'); toastTitle('🏅 메달 +500'); });
$('btnReset').addEventListener('click', () => {
    if (!resetArmed) { resetArmed = true; renderDebug(); return; }
    resetArmed = false;
    save = { medal: 0, up: {}, best: 0, cls: 'scout', sound: Snd.on, free: save.free };
    persist(); sfx('lose'); setHero(save.cls); renderDebug(); toastTitle('계정을 초기화했어요');
});
function toastTitle(msg) { $('btnDebugBack').textContent = msg; setTimeout(() => $('btnDebugBack').textContent = '돌아가기', 1200); }

$('btnStart').addEventListener('click', () => { sfx('click'); startRun(); });
$('btnShop').addEventListener('click', () => { audioInit(); sfx('click'); renderShop(); $('shop').classList.remove('hidden'); $('title').classList.add('hidden'); });
$('btnShopBack').addEventListener('click', () => { sfx('click'); $('shop').classList.add('hidden'); $('title').classList.remove('hidden'); renderTitle(); });
$('btnSnd').addEventListener('click', () => { audioInit(); setSound(!Snd.on); });
$('btnSnd2').addEventListener('click', () => { audioInit(); setSound(!Snd.on); });
$('btnPause').addEventListener('click', () => G.state === 'pause' ? resumeGame() : pauseGame());
$('btnResume').addEventListener('click', resumeGame);
$('btnQuit').addEventListener('click', () => { $('pause').classList.add('hidden'); G.state = 'play'; endRun(false, '작전을 중단하고 귀환했어요'); });
$('btnAgain').addEventListener('click', () => { sfx('click'); $('result').classList.add('hidden'); startRun(); });
$('btnHome').addEventListener('click', () => { sfx('click'); goTitle(); });
setSound(Snd.on);

/* ---------- 입력 ---------- */
addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Escape' || e.code === 'KeyP') { if (G.state === 'play') pauseGame(); else if (G.state === 'pause') resumeGame(); }
    if (G.state === 'levelup') { if (e.code.startsWith('Digit')) pickChoice(+e.code.slice(5) - 1); if (e.code === 'KeyR') $('btnReroll').click(); }
    else if (G.state === 'clear' && e.code === 'Enter') $('btnNext').click();
    else if (G.state === 'title' && (e.code === 'Enter' || e.code === 'Space') && $('shop').classList.contains('hidden')) startRun();
    if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; joy.on = false; $('joy').classList.add('hidden'); pauseGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
canvas.addEventListener('pointerdown', e => {
    if (G.state !== 'play' || joy.on) return;
    audioInit();
    const r = app.getBoundingClientRect();
    joy.on = true; joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.dx = joy.dy = 0;
    const j = $('joy'); j.style.left = (e.clientX - r.left) + 'px'; j.style.top = (e.clientY - r.top) + 'px'; j.classList.remove('hidden'); $('knob').style.transform = '';
});
addEventListener('pointermove', e => {
    if (!joy.on || e.pointerId !== joy.id) return;
    let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy; const l = Math.hypot(dx, dy), m = 44;
    if (l > m) { dx = dx / l * m; dy = dy / l * m; }
    joy.dx = dx / m; joy.dy = dy / m;
    $('knob').style.transform = `translate(${dx}px, ${dy}px)`;
});
const joyEnd = e => { if (e.pointerId !== joy.id) return; joy.on = false; joy.dx = joy.dy = 0; $('joy').classList.add('hidden'); };
addEventListener('pointerup', joyEnd); addEventListener('pointercancel', joyEnd);

/* ---------- 메인 루프 ---------- */
let last = performance.now();
function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (G.state === 'play') { update(dt); animHero(dt, P.moving, P.mining); updateHud(dt); }
    else if (G.state === 'title') updateTitle(dt);
    else if (G.state === 'over') { updateParts(dt); animHero(dt, false, false); }
    draw(dt, now);
    renderer.render(scene, camera);
}
goTitle();
requestAnimationFrame(frame);
window.__cm = { G, P, run: () => run, enemies: () => enemies, S, save: () => save, cells, W, H };
</script>
</body>
