<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1033">
<title>연산RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
    :root {
        --ink: #3b2410;
        --cream: #fff8e7;
        --paper: #fde9b8;
        --rim: #7a4a1e;
        --gold: #f5c542;
        --red: #ef4444;
        --green: #22c55e;
        --blue: #3b82f6;
        --rare: #3b82f6;
        --legend: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
        font-family: "Jua", "Pretendard", system-ui, sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at 20% 10%, #3b2a6b 0, transparent 50%),
                    radial-gradient(circle at 80% 90%, #4a1d5c 0, transparent 50%), #1b1033;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none; -webkit-user-select: none;
    }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }

    /* 게임 화면 (세로 스마트폰 기준) */
    #app {
        position: relative;
        width: min(100vw, 480px);
        height: 100vh; height: 100dvh;
        max-height: 960px;
        overflow: hidden;
        background: var(--paper);
    }
    @media (min-width: 520px) and (min-height: 720px) {
        #app {
            height: min(calc(100dvh - 40px), 900px);
            border-radius: 30px;
            box-shadow: 0 0 0 6px var(--rim), 0 0 0 10px #f5c542, 0 30px 80px rgba(0, 0, 0, .6);
        }
    }
    .screen { position: absolute; inset: 0; display: none; flex-direction: column; }
    .screen.on { display: flex; }

    /* 공통 버튼 */
    .btn {
        --bg: var(--green); --sh: #15803d;
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        padding: 14px 22px; border-radius: 20px;
        font-size: 24px; color: #fff;
        background: var(--bg);
        box-shadow: 0 6px 0 var(--sh), 0 12px 20px rgba(0, 0, 0, .22);
        text-shadow: 0 2px 0 rgba(0, 0, 0, .18);
        transition: transform .08s, box-shadow .08s, filter .15s;
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sh), 0 4px 8px rgba(0, 0, 0, .2); }
    .btn:disabled { filter: grayscale(1) opacity(.55); pointer-events: none; }
    .btn.pink { --bg: #f43f5e; --sh: #be123c; }
    .btn.blue { --bg: var(--blue); --sh: #1d4ed8; }
    .btn.gold { --bg: #f59e0b; --sh: #b45309; }
    .btn.gray { --bg: #a8a29e; --sh: #78716c; }
    .btn.big { font-size: 30px; padding: 18px 26px; border-radius: 24px; }
    .icon-btn {
        width: 46px; height: 46px; border-radius: 15px; flex: none;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 22px;
        background: rgba(255, 248, 231, .92);
        border: 3px solid var(--rim);
        box-shadow: 0 4px 0 var(--rim);
    }
    .icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--rim); }
    .panel {
        background: var(--cream);
        border: 4px solid var(--rim);
        border-radius: 24px;
        box-shadow: 0 6px 0 var(--rim), 0 16px 30px rgba(0, 0, 0, .25);
    }
    .chip {
        display: inline-flex; align-items: center; gap: 4px;
        background: #fff; border: 2px solid #e7d3a7; border-radius: 999px;
        padding: 4px 10px; font-size: 16px; white-space: nowrap;
    }
    .coin-pill {
        display: inline-flex; align-items: center; gap: 4px;
        background: #fff8e7; border: 3px solid var(--rim); border-radius: 999px;
        padding: 4px 12px; font-size: 19px; box-shadow: 0 3px 0 var(--rim);
    }
    .head-title {
        flex: 1; text-align: center; font-size: 28px; color: #fff; font-weight: 400;
        text-shadow: 0 3px 0 var(--rim), 2px 0 0 var(--rim), -2px 0 0 var(--rim), 0 -2px 0 var(--rim);
    }

    /* ===== 배경 장면 ===== */
    .sky {
        position: absolute; inset: 0; overflow: hidden;
        background: linear-gradient(var(--s1), var(--s2));
    }
    .sky.night::before {
        content: ""; position: absolute; inset: 0 0 40% 0;
        background-image:
            radial-gradient(2px 2px at 12% 18%, #fff 50%, transparent 51%),
            radial-gradient(2px 2px at 30% 40%, #fff 50%, transparent 51%),
            radial-gradient(1.5px 1.5px at 48% 12%, #fff 50%, transparent 51%),
            radial-gradient(2px 2px at 66% 32%, #fff 50%, transparent 51%),
            radial-gradient(1.5px 1.5px at 84% 14%, #fff 50%, transparent 51%),
            radial-gradient(2px 2px at 90% 44%, #fff 50%, transparent 51%),
            radial-gradient(1.5px 1.5px at 6% 52%, #fff 50%, transparent 51%);
        opacity: .8; animation: twinkle 3s ease-in-out infinite alternate;
    }
    @keyframes twinkle { to { opacity: .35; } }
    .orb { position: absolute; top: 9%; right: 10%; width: 52px; height: 52px; border-radius: 50%; }
    .orb.sun { background: #fde68a; box-shadow: 0 0 0 10px rgba(253, 230, 138, .35), 0 0 50px #fde68a; }
    .orb.moon { background: #f8fafc; box-shadow: inset -10px -4px 0 #cbd5e1, 0 0 36px rgba(255, 255, 255, .55); }
    .cloud {
        position: absolute; width: 90px; height: 26px; border-radius: 20px;
        background: rgba(255, 255, 255, .9);
        animation: drift 26s linear infinite;
    }
    .cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
    .cloud::before { width: 40px; height: 40px; left: 14px; top: -20px; }
    .cloud::after { width: 30px; height: 30px; left: 44px; top: -13px; }
    .cloud.c1 { top: 16%; left: -100px; }
    .cloud.c2 { top: 30%; left: -100px; transform: scale(.7); animation-duration: 38s; animation-delay: -18s; }
    .sky.night .cloud { opacity: .25; }
    @keyframes drift { to { left: 110%; } }
    .hill { position: absolute; bottom: 20%; border-radius: 50% 50% 0 0; background: var(--g); }
    .hill.h1 { left: -20%; width: 85%; height: 38%; filter: brightness(1.3); opacity: .75; }
    .hill.h2 { right: -25%; width: 80%; height: 30%; filter: brightness(1.15); }
    .ground {
        position: absolute; left: 0; right: 0; bottom: 0; height: 22%;
        background: var(--g);
        box-shadow: inset 0 7px 0 rgba(255, 255, 255, .22);
    }
    .actor { position: absolute; bottom: 9%; width: min(38%, 168px); aspect-ratio: 1; z-index: 2; }
    .actor .bob { width: 100%; height: 100%; animation: bob 1.6s ease-in-out infinite; }
    .actor svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .actor.monster .bob { animation-duration: 1.2s; }
    @keyframes bob { 50% { transform: translateY(-6px) scaleY(1.02); } }

    /* ===== 타이틀 ===== */
    #scr-title .logo {
        position: absolute; top: 7%; left: 0; right: 0; z-index: 3;
        text-align: center; line-height: .95;
        color: #fff;
        text-shadow: 0 3px 0 var(--rim), 3px 0 0 var(--rim), -3px 0 0 var(--rim), 0 -3px 0 var(--rim),
                     2px 2px 0 var(--rim), -2px 2px 0 var(--rim), 2px -2px 0 var(--rim), -2px -2px 0 var(--rim),
                     0 9px 0 #b45309, 0 14px 24px rgba(0, 0, 0, .3);
        animation: logoIn .8s cubic-bezier(.2, 1.6, .4, 1) both;
    }
    .logo .l1 { font-size: 72px; color: #fde047; }
    .logo .l2 { font-size: 60px; letter-spacing: 2px; }
    @keyframes logoIn { from { transform: scale(.4) rotate(-6deg); opacity: 0; } }
    #scr-title .actor.hero { left: 6%; bottom: 46%; width: min(32%, 140px); }
    #scr-title .actor.monster { right: 8%; bottom: 46%; width: min(26%, 112px); }
    #scr-title .menu {
        position: absolute; left: 14px; right: 14px; bottom: max(18px, env(safe-area-inset-bottom));
        z-index: 3; padding: 16px 16px 16px; display: flex; flex-direction: column; gap: 12px;
    }
    .menu .row { display: flex; gap: 8px; align-items: center; }
    .menu .row .btn { flex: 1; font-size: 21px; padding: 12px; }
    .grade-chip {
        flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 6px;
        background: #fff; border: 3px solid #e7d3a7; border-radius: 16px; padding: 8px 12px; font-size: 18px;
    }
    .grade-chip small { color: #a16207; font-size: 14px; }
    .record-line { text-align: center; font-size: 16px; color: #92400e; }
    .cycle-pick { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 19px; }
    .cycle-pick button { width: 34px; height: 34px; border-radius: 10px; background: #fff; border: 2px solid #e7d3a7; font-size: 16px; }
    .cycle-pick button:disabled { opacity: .3; }
    .cycle-pick[hidden] { display: none; }
    .top-right { position: absolute; top: max(14px, env(safe-area-inset-top)); right: 14px; z-index: 5; }

    /* ===== 학년 선택 ===== */
    #scr-grade { background: linear-gradient(#7dd3fc, #fde9b8 55%); }
    #scr-grade .wrap { flex: 1; overflow-y: auto; padding: max(28px, env(safe-area-inset-top)) 18px 24px; text-align: center; }
    #scr-grade h2 { font-size: 34px; font-weight: 400; color: #fff; text-shadow: 0 3px 0 var(--rim), 2px 0 0 var(--rim), -2px 0 0 var(--rim), 0 -2px 0 var(--rim); }
    #scr-grade p { margin: 8px 0 18px; font-size: 17px; color: #1e3a8a; }
    .grades { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grades button {
        background: var(--cream); border: 3px solid var(--rim); border-radius: 18px; box-shadow: 0 5px 0 var(--rim);
        padding: 14px 8px; font-size: 22px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .grades button span { font-size: 30px; }
    .grades button small { font-size: 13px; color: #92400e; }
    .grades button.wide { grid-column: 1 / -1; flex-direction: row; justify-content: center; gap: 10px; font-size: 19px; }
    .grades button.wide span { font-size: 26px; }
    .grades button.sel { background: #dcfce7; border-color: #16a34a; box-shadow: 0 5px 0 #16a34a; }
    .grades button:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--rim); }

    /* ===== 상점 ===== */
    #scr-shop { background: linear-gradient(#fbbf24, #fde9b8 40%); }
    .shop-head { display: flex; align-items: center; gap: 10px; padding: max(14px, env(safe-area-inset-top)) 14px 12px; }
    .shop-list { flex: 1; overflow-y: auto; padding: 4px 14px 24px; display: flex; flex-direction: column; gap: 10px; }
    .shop-note { text-align: center; font-size: 16px; color: #92400e; margin-bottom: 2px; }
    .item { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border-radius: 20px; }
    .item .ic { font-size: 34px; width: 44px; text-align: center; flex: none; }
    .item .tx { flex: 1; min-width: 0; }
    .item .tx b { display: block; font-weight: 400; font-size: 20px; }
    .item .tx span { font-size: 15px; color: #92400e; }
    .lv-dots { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; }
    .lv-dots i { width: 9px; height: 9px; border-radius: 50%; background: #e7d3a7; }
    .lv-dots i.on { background: var(--gold); box-shadow: 0 0 0 1.5px #b45309; }
    .item .btn { font-size: 18px; padding: 10px 12px; border-radius: 14px; min-width: 88px; }

    /* ===== 전투 ===== */
    #scr-battle { background: var(--paper); }
    .bar-top {
        position: absolute; top: 0; left: 0; right: 0; z-index: 6;
        padding: max(10px, env(safe-area-inset-top)) 12px 0;
        display: flex; align-items: center; gap: 8px;
    }
    .bar-top .title {
        flex: 1; text-align: center; font-size: 18px; color: #fff;
        text-shadow: 0 2px 0 rgba(0, 0, 0, .45), 0 0 8px rgba(0, 0, 0, .35);
    }
    .bar-top .icon-btn { width: 40px; height: 40px; font-size: 19px; border-radius: 13px; }
    .scene { position: relative; flex: 1 1 auto; min-height: 180px; overflow: hidden; }
    .plates {
        position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 48px); left: 10px; right: 10px; z-index: 4;
        display: flex; justify-content: space-between; gap: 10px;
    }
    .plate {
        flex: 1; max-width: 48%;
        background: rgba(255, 248, 231, .94); border: 3px solid var(--rim); border-radius: 14px;
        padding: 5px 8px 7px;
    }
    .plate .nm { display: flex; justify-content: space-between; align-items: center; font-size: 15px; gap: 4px; white-space: nowrap; }
    .plate .nm small { font-size: 13px; color: #92400e; }
    .hp { position: relative; height: 16px; margin-top: 3px; border-radius: 8px; background: #e7d3a7; overflow: hidden; border: 2px solid var(--rim); }
    .hp i { position: absolute; inset: 0; width: 100%; border-radius: 5px; transition: width .45s ease; }
    .hp i.ghost { background: #fca5a5; transition: width .9s ease .35s; }
    .hp i.fill { background: linear-gradient(#4ade80, #16a34a); }
    .plate.mon .hp i.fill { background: linear-gradient(#fb7185, #e11d48); }
    .hp em { position: absolute; inset: 0; font-style: normal; font-size: 12px; line-height: 12px; text-align: center; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
    #scr-battle .actor.hero { left: 4%; }
    #scr-battle .actor.monster { right: 4%; }
    .buffs {
        position: absolute; left: 10px; top: calc(max(10px, env(safe-area-inset-top)) + 104px); z-index: 4;
        display: flex; gap: 4px; flex-wrap: wrap; max-width: 60%;
    }
    .buffs span { font-size: 13px; background: rgba(255, 255, 255, .92); border: 2px solid #e7d3a7; border-radius: 999px; padding: 1px 7px; }

    .lunge-r { animation: lungeR .45s ease; }
    .lunge-l { animation: lungeL .45s ease; }
    @keyframes lungeR { 40% { transform: translateX(46%) rotate(6deg); } }
    @keyframes lungeL { 40% { transform: translateX(-46%) rotate(-6deg); } }
    .ouch { animation: ouch .45s ease; }
    @keyframes ouch {
        0%, 100% { filter: none; transform: none; }
        20% { filter: brightness(2.2) saturate(0); transform: translateX(8px); }
        40% { transform: translateX(-8px); }
        60% { filter: brightness(1.6) sepia(1) hue-rotate(-40deg) saturate(4); transform: translateX(5px); }
    }
    .dead { animation: poof .8s ease forwards; }
    @keyframes poof { 30% { transform: scale(1.15) rotate(-8deg); filter: brightness(2); } 100% { transform: scale(.2) rotate(30deg); opacity: 0; } }
    .shake { animation: shake .4s ease; }
    @keyframes shake { 20% { transform: translate(6px, -3px); } 40% { transform: translate(-6px, 3px); } 60% { transform: translate(4px, 2px); } 80% { transform: translate(-3px, -2px); } }
    .slash {
        position: absolute; z-index: 5; width: 130px; height: 130px; pointer-events: none;
        border-radius: 50%; border-top: 9px solid #fff; border-right: 4px solid rgba(255, 255, 255, .5);
        filter: drop-shadow(0 0 8px #fde047);
        animation: slash .32s ease-out forwards;
    }
    .slash.crit { border-top-color: #fde047; width: 170px; height: 170px; }
    @keyframes slash { from { transform: rotate(-80deg) scale(.6); opacity: 1; } to { transform: rotate(40deg) scale(1.1); opacity: 0; } }
    .float {
        position: absolute; z-index: 7; pointer-events: none; transform: translateX(-50%);
        font-size: 38px; color: #fff; white-space: nowrap;
        text-shadow: 0 3px 0 #b91c1c, 2px 0 0 #b91c1c, -2px 0 0 #b91c1c, 0 -2px 0 #b91c1c;
        animation: floatUp .95s ease-out forwards;
    }
    .float.crit { font-size: 50px; color: #fde047; text-shadow: 0 3px 0 #b45309, 2px 0 0 #b45309, -2px 0 0 #b45309, 0 -2px 0 #b45309; }
    .float.heal { color: #bbf7d0; text-shadow: 0 3px 0 #15803d, 2px 0 0 #15803d, -2px 0 0 #15803d, 0 -2px 0 #15803d; font-size: 28px; }
    @keyframes floatUp { 0% { transform: translate(-50%, 10px) scale(.5); opacity: 0; } 20% { transform: translate(-50%, -10px) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -70px) scale(1); opacity: 0; } }
    .spark { position: absolute; z-index: 6; width: 12px; height: 12px; border-radius: 50%; pointer-events: none; animation: spark .7s ease-out forwards; }
    @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
    .banner {
        position: absolute; left: 0; right: 0; top: 55%; z-index: 8; pointer-events: none;
        text-align: center; font-size: clamp(26px, 8vw, 42px); color: #fff; white-space: nowrap;
        transform: translateY(-50%); opacity: 0;
    }
    .banner span {
        display: inline-block; padding: 8px 24px; border-radius: 20px;
        background: var(--bb, #2563eb); border: 4px solid #fff;
        box-shadow: 0 6px 0 rgba(0, 0, 0, .25);
        text-shadow: 0 3px 0 rgba(0, 0, 0, .25);
    }
    .banner.show { animation: banner 1.1s ease forwards; }
    @keyframes banner {
        0% { opacity: 0; transform: translateY(-50%) scale(.3); }
        18% { opacity: 1; transform: translateY(-50%) scale(1.12); }
        28%, 78% { opacity: 1; transform: translateY(-50%) scale(1); }
        100% { opacity: 0; transform: translateY(-50%) scale(1.3); }
    }

    .lower { position: relative; flex: 0 0 auto; display: flex; flex-direction: column; }
    .quiz { margin: -16px 12px 0; position: relative; z-index: 5; padding: 10px 14px 10px; }
    .qhead { display: flex; justify-content: space-between; align-items: center; font-size: 16px; margin-bottom: 5px; }
    .qhead .optag { padding: 2px 10px; border-radius: 999px; color: #fff; background: var(--oc, #22c55e); font-size: 15px; }
    .qhead .sec { color: #92400e; font-variant-numeric: tabular-nums; }
    .timer { position: relative; height: 12px; border-radius: 6px; background: #f1e1bb; overflow: hidden; }
    .timer i { position: absolute; inset: 0; width: 100%; background: linear-gradient(90deg, #22c55e, #84cc16); border-radius: 6px; }
    .timer.low i { background: linear-gradient(90deg, #ef4444, #f97316); animation: blink .5s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .55; } }
    .quiz .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 15px; color: #92400e; gap: 6px; }
    .dots { display: flex; gap: 4px; align-items: center; }
    .dots b {
        width: 22px; height: 22px; border-radius: 50%; font-weight: 400; font-size: 13px;
        display: inline-flex; align-items: center; justify-content: center;
        background: #f1e1bb; border: 2px solid #d6b46a; color: transparent;
    }
    .dots b.on { background: var(--gold); border-color: #b45309; color: #fff; animation: popIn .3s ease; }
    .dots b.last { border-style: dashed; color: #b45309; }
    .dots b.last.on { background: #f97316; color: #fff; }
    @keyframes popIn { from { transform: scale(1.8); } }
    .combo { color: #ea580c; }
    .combo.pop, .score.pop { animation: popIn .3s ease; }
    .score { color: var(--ink); background: #fff; border-radius: 999px; padding: 1px 10px; border: 2px solid #e7d3a7; }
    .question {
        display: flex; align-items: center; justify-content: center;
        margin-top: 6px; min-height: 60px; font-size: 42px; white-space: nowrap;
    }
    .question.long { font-size: 33px; }
    .question.xlong { font-size: 25px; }
    .qh { display: flex; align-items: center; gap: .22em; }
    .tok, .cells { display: inline-flex; align-items: center; }
    /* 답칸 */
    .cell {
        display: inline-flex; align-items: center; justify-content: center;
        width: .95em; height: 1.2em; margin: 0 .04em; border-radius: .22em;
        font-size: inherit; line-height: 1;
        background: #fff; border: 3px solid #d6b46a; color: #2563eb;
        transition: background .15s, border-color .15s;
    }
    .cell.cur { border-color: #f97316; background: #fff7ed; box-shadow: 0 0 0 3px rgba(249, 115, 22, .3); }
    .cell.given { background: #f1e1bb; color: #92400e; border-style: dashed; }
    .cell.ok { border-color: var(--green); color: #16a34a; background: #dcfce7; }
    .cell.bad { border-color: var(--red); color: #dc2626; background: #fee2e2; animation: shake .4s; }
    /* 세로셈 */
    .vgrid {
        display: inline-grid; grid-template-columns: repeat(var(--cols), 1.08em);
        column-gap: .12em; row-gap: .06em; justify-items: center; align-items: center;
        font-size: clamp(26px, 4.2dvh, 36px); line-height: 1.1;
    }
    .vgrid .cell { width: 1.02em; margin: 0; }
    .vgrid .sym { color: #92400e; }
    .vgrid .vline { grid-column: 1 / -1; justify-self: stretch; height: 3px; background: var(--ink); border-radius: 2px; margin: 2px 0; }
    .memo {
        width: 1.3em; height: 1.05em; font-size: .68em; line-height: 1; border-radius: .25em;
        display: inline-flex; align-items: center; justify-content: center;
        border: 2px dashed #fdba74; background: #fff7ed; color: #ea580c;
    }
    .memo.cur { border-style: solid; border-color: #ea580c; box-shadow: 0 0 0 3px rgba(234, 88, 12, .25); }
    .hint { min-height: 22px; text-align: center; font-size: 17px; color: #16a34a; }
    .pad {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px;
        padding: 10px 14px max(14px, env(safe-area-inset-bottom));
    }
    .key {
        height: clamp(46px, 7dvh, 62px); border-radius: 16px;
        font-size: 32px; background: #fff;

<script>
/* =========================================================================
   연산RPG — 세로 스마트폰용 로그라이크 연산 게임
   한 판(런) = 10스테이지. 스테이지를 깰 때마다 [문제 카드 + 보상] 중 하나를 골라
   문제 풀과 능력이 바뀐다. 쓰러지면 점수만큼 코인을 받고, 상점에서 영구 성장한다.
   ========================================================================= */

const $ = (id) => document.getElementById(id);
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = R(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const fmt = (n) => Math.round(n).toLocaleString("ko-KR");

/* =========================================================================
   [설정값] 밸런스는 여기서 조절
   ========================================================================= */
const STAGE_COUNT = 10;
const HITS_FOR_CRIT = 5;     // 한 턴에 이만큼 맞히면 크리티컬 (🍀 보상으로 줄어듦)
const WIN_HEAL = 0.2;        // 스테이지 클리어 시 최대 체력의 20% 회복
const LEVEL_DMG_BONUS = .15; // 학년 기본보다 1레벨 높을 때마다 데미지 +15%
const MAX_CYCLE = 5;

/* 학년 보정: 같은 문제라도 어릴수록 오래 걸림 (4학년 = 1.0) */
const GRADE_FACTOR = [1.8, 1.6, 1.4, 1.2, 1.0, .9, .9, .8];
/* 예상 풀이 시간(초) = 생각하는 시간 × 학년 보정 + 칸 입력 0.8초씩 + 확인 1초 */
function expectedTime(p, grade) { return p.cog * GRADE_FACTOR[grade] + .8 * (p.ans.length - p.hints) + 1; }
/* 제한시간 = 예상 시간 × 배율. 첫 스테이지 2배에서 스테이지마다 줄어 최소 1.3배. 어떤 문제도 5초 미만은 없음 */
function timeLimit(p, stage, cycle, bonus) {
    const f = Math.max(1.3, 2 - .08 * (stage - 1) - .1 * (cycle - 1));
    return Math.max(5, Math.round((p.exp * f + bonus) * 2) / 2);
}
/* 몬스터 능력치 */
function monStats(stage, cycle) {
    const s = stage - 1, boss = stage === STAGE_COUNT;
    const hp = (80 + 35 * s + 6 * s * s) * (1 + .4 * (cycle - 1)) * (boss ? 1.4 : 1);
    const atk = (14 + 5 * s) * (1 + .3 * (cycle - 1)) * (boss ? 1.2 : 1);
    return { hp: Math.round(hp), atk: Math.round(atk) };
}
/* 문제 하나의 점수: 레벨 점수 + 예상 시간보다 빨리 풀수록 최대 +100 + 콤보 */
function scoreFor(level, used, exp, combo, cycle) {
    const speed = 100 * Math.min(1, Math.max(0, (exp - used) / exp));
    return Math.round((100 * (1 + .25 * (level - 1)) + speed + combo * 10) * (1 + .5 * (cycle - 1)));
}
const COIN_RATE = 10;        // 점수 10점 = 코인 1개

/* =========================================================================
   연산과 학년
   ========================================================================= */
const OPS = {
    add: { icon: "➕", name: "덧셈",   color: "#16a34a" },
    sub: { icon: "➖", name: "뺄셈",   color: "#2563eb" },
    mul: { icon: "✖️", name: "곱셈",   color: "#ea580c" },
    div: { icon: "➗", name: "나눗셈", color: "#9333ea" },
};
const OP_KEYS = ["add", "sub", "mul", "div"];
const MAX_LEVEL = 10;

/* 학년: 연산별 시작 레벨 [덧셈, 뺄셈, 곱셈, 나눗셈] 과 첫 스테이지에 나오는 연산 */
const GRADES = [
    { name: "아직 초등학교 안 들어갔어요", short: "미취학", icon: "🧸", start: [1, 1, 1, 1], first: ["add"] },
    { name: "1학년", short: "1학년", icon: "🎒", start: [2, 2, 1, 1], first: ["add"] },
    { name: "2학년", short: "2학년", icon: "🎒", start: [4, 4, 2, 1], first: ["add", "sub"] },
    { name: "3학년", short: "3학년", icon: "🎒", start: [6, 6, 4, 2], first: ["add", "sub"] },
    { name: "4학년", short: "4학년", icon: "🎒", start: [7, 7, 5, 4], first: ["add", "sub", "mul"] },
    { name: "5학년", short: "5학년", icon: "🎒", start: [8, 8, 6, 6], first: ["mul", "div"] },
    { name: "6학년", short: "6학년", icon: "🎒", start: [8, 8, 7, 7], first: ["mul", "div"] },
    { name: "초등학교 졸업했어요", short: "졸업", icon: "🎓", start: [9, 9, 8, 8], first: ["add", "sub", "mul", "div"] },
];
const gradeStart = (g, op) => GRADES[g].start[OP_KEYS.indexOf(op)];

/* ----- 문제 만들기 (정수만) -----
   문제 p = { form: "h" 가로식 | "v" 세로셈 | "blank" □ 찾기,
              ans: 칸에 채울 숫자들, cog: 생각하는 데 드는 초(4학년 기준), hint: 미리 채워 줄 칸 수 } */
const len = (n) => String(n).length;
const dig = (n, i) => Math.floor(n / 10 ** i) % 10;          // 오른쪽에서 i번째 자리 숫자
const nzCols = (...ns) => { let c = 0; for (let i = 0; i < Math.max(...ns.map(len)); i++) if (ns.some(n => dig(n, i))) c++; return Math.max(1, c); };
function carriesAdd(ns) { let c = 0, carry = 0; for (let i = 0; i < Math.max(...ns.map(len)); i++) { carry = Math.floor((carry + ns.reduce((s, n) => s + dig(n, i), 0)) / 10); if (carry) c++; } return c; }
function borrowsSub(a, b) { let c = 0, br = 0; for (let i = 0; i < len(a); i++) { if (dig(a, i) - br < dig(b, i)) { c++; br = 1; } else br = 0; } return c; }
function carriesMul(a, d) { let c = 0, carry = 0; for (let i = 0; i < len(a); i++) { carry = Math.floor((dig(a, i) * d + carry) / 10); if (carry && i < len(a) - 1) c++; } return c; }

/* 생각하는 시간(초, 4학년 기준). 참고한 연구값: 한 자리 계산 약 3초,
   두 자리 덧셈 받아올림 1번 약 6초 · 2번이면 12초 이상. 0만 있는 자리는 계산하지 않는 것으로 봄 */
const cogAdd = (...ns) => ns.every(n => n < 10) ? 3 : 3 + 2 * (nzCols(...ns) - 1) + 3 * carriesAdd(ns);
const cogSub = (a, b) => a < 20 && b < 10 ? (a > 10 ? 4 : 3) : 3.5 + 2 * (nzCols(a, b) - 1) + 3.5 * borrowsSub(a, b);
const cogMul = (a, d) => a < 10 ? 3.5 : 3.5 + 3 * (nzCols(a) - 1) + 2.5 * carriesMul(a, d);
const cogDiv = (b, q) => 4 + 4 * (nzCols(q) - 1) + (b >= 10 ? 4 : 0);

const H = (q, a, cog) => ({ form: "h", q, ans: String(a), full: `${q} = ${a}`, cog });
const V = (a, b, sym, r, cog, hint = 0) => ({ form: "v", terms: [a, b], sym, ans: String(r), full: `${a} ${sym} ${b} = ${r}`, cog, hint });
const calc = (x, sym, y) => sym === "+" ? x + y : sym === "−" ? x - y : sym === "×" ? x * y : x / y;

/* □ 찾기: "x sym y = z" 에서 몇 자리를 가린다. hide = [[항 번호(0~2), [가릴 자리(왼쪽부터)]], ...]
   답이 하나뿐일 때만 문제로 쓰고, 여러 개면 null */
function blankP(x, sym, y, z, cog, hide) {
    const toks = [String(x), String(y), String(z)];
    const slots = [];
    hide.forEach(([t, pos]) => [...pos].sort((a, b) => a - b).forEach(i => slots.push([t, i])));
    let found = 0;
    for (let v = 0; v < 10 ** slots.length; v++) {
        const tk = toks.map(s => s.split(""));
        const ds = String(v).padStart(slots.length, "0");
        slots.forEach(([t, i], k) => { tk[t][i] = ds[k]; });
        if (tk.some(a => a.length > 1 && a[0] === "0")) continue;
        const [a, b, c] = tk.map(a => +a.join(""));
        if (sym === "÷" && (b === 0 || a % b)) continue;
        if (calc(a, sym, b) === c && ++found > 1) return null;
    }
    const hidden = (t, i) => slots.some(([tt, ii]) => tt === t && ii === i);
    return {
        form: "blank", sym,
        parts: toks.map((s, t) => s.split("").map((ch, i) => hidden(t, i) ? null : ch)),
        ans: slots.map(([t, i]) => toks[t][i]).join(""),
        full: `${x} ${sym} ${y} = ${z}`, cog: cog + 3,          // 거꾸로 생각하는 데 +3초
    };
}
const oneDigit = (t, n) => [[t, [R(0, len(n) - 1)]]];
/* 세 자리 □ 찾기: 앞의 수 한 칸 + 답 한 칸. 답이 하나뿐인 조합이 나올 때까지 다시 뽑음 */
function twoBlank3(sym) {
    for (let i = 0; i < 60; i++) {
        let a = R(200, 899), b = R(100, 699);
        if (sym === "−" && a < b) [a, b] = [b, a];
        const z = calc(a, sym, b), cog = sym === "+" ? cogAdd(a, b) : cogSub(a, b);
        if (z < 100) continue;
        const p = blankP(a, sym, b, z, cog, [[0, [R(0, 2)]], [2, [R(0, len(z) - 1)]]]);
        if (p) { p.cog += 2; return p; }
    }
    const a = R(200, 899), b = R(100, 199);
    return blankP(a, sym, b, calc(a, sym, b), sym === "+" ? cogAdd(a, b) : cogSub(a, b), oneDigit(0, a));
}

function rollReward(r, risk, minRarity) {
    let rar = "common";
    const x = Math.random();
    if (x < Math.min(.35, .04 + .06 * risk)) rar = "legend";
    else if (x < Math.min(.75, .24 + .1 * risk)) rar = "rare";
    if (minRarity === "rare" && rar === "common") rar = "rare";
    const pool = REWARDS[rar].filter(rw => !(rw.once && rw.once(r)));
    return { rar, rw: pick(pool.length ? pool : REWARDS.common) };

             <circle cx="${x - r * .2}" cy="${y + r * .15}" r="${r * .58}" fill="#1f2937"/>
             <circle cx="${x - r * .4}" cy="${y - r * .15}" r="${r * .22}" fill="#fff"/>`;
    if (angry) {
        const [y1, y2] = side < 0 ? [y - r * 1.7, y - r * 1.05] : [y - r * 1.05, y - r * 1.7];
        s += `<path d="M${x - r * 1.1} ${y1} L${x + r * 1.1} ${y2}" stroke="#1f2937" stroke-width="${r * .45}" stroke-linecap="round"/>`;
    }

}

/* =========================================================================
   소리 (Web Audio로 직접 합성)
   ========================================================================= */
const Sfx = {
    ctx: null, muted: false,
    unlock() {
        if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
        if (this.ctx.state === "suspended") this.ctx.resume();
    },
    tone(f, d = .12, type = "sine", v = .14, f2 = null, delay = 0) {
        if (this.muted || !this.ctx) return;
        const t = this.ctx.currentTime + delay;
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f, t);
        if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
        g.gain.setValueAtTime(v, t);
        g.gain.exponentialRampToValueAtTime(.001, t + d);
        o.connect(g).connect(this.ctx.destination);
        o.start(t); o.stop(t + d + .02);
    },
    key()     { this.tone(700, .05, "triangle", .07); },
    correct() { this.tone(660, .1, "triangle", .14); this.tone(990, .16, "triangle", .14, null, .08); },
    wrong()   { this.tone(240, .3, "sawtooth", .07, 150); },
    hit()     { this.tone(320, .14, "square", .08, 90); },
    crit()    { this.tone(200, .3, "sawtooth", .1, 60); [784, 988, 1319].forEach((f, i) => this.tone(f, .14, "triangle", .12, null, .05 + i * .07)); },
    hurt()    { this.tone(170, .28, "sawtooth", .11, 60); },
    block()   { this.tone(1200, .2, "triangle", .1, 600); },
    turn()    { this.tone(523, .09, "triangle", .1); this.tone(784, .12, "triangle", .1, null, .09); },
    tick()    { this.tone(1000, .04, "sine", .05); },
    coin()    { this.tone(988, .08, "square", .06); this.tone(1319, .18, "square", .06, null, .07); },
    win()     { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .2, "triangle", .14, null, i * .12)); },
    rest()    { [523, 440, 392, 523].forEach((f, i) => this.tone(f, .22, "triangle", .1, null, i * .16)); },
};
document.addEventListener("pointerdown", () => Sfx.unlock(), { capture: true });

const SAVE_KEY = "mathrpg-v3";
const defaultSave = () => ({
    grade: null, coins: 0, muted: false,
    shop: { atk: 0, hp: 0, def: 0, crit: 0, time: 0, gift: 0 },
    cycleUnlocked: 1, cycle: 1,
    records: {},   // 학년별 { best, bestStage, clears, stageBest: {스테이지: 점수} }
});
let save = defaultSave();
try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s) save = { ...save, ...s, shop: { ...save.shop, ...(s.shop || {}) } };
} catch (e) { /* 저장 못 읽으면 새로 시작 */ }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* 무시 */ } }
const rec = (g = save.grade) => (save.records[g] ||= { best: 0, bestStage: 0, clears: 0, stageBest: {} });
Sfx.muted = !!save.muted;

/* =========================================================================
   공용
   ========================================================================= */
function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }
function play(el, cls, ms) {
    el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), ms);
}
let toastTimer;
function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("on");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 1700);
}
function confirmBox(text, yes = "네", no = "아니요") {
    return new Promise(res => {
        $("modalText").textContent = text; $("modalYes").textContent = yes; $("modalNo").textContent = no;
        $("modal").classList.add("on");
        const done = (v) => { $("modal").classList.remove("on"); $("modalYes").onclick = $("modalNo").onclick = null; res(v); };
        $("modalYes").onclick = () => done(true); $("modalNo").onclick = () => done(false);
    });
}
function syncSoundButtons() { document.querySelectorAll("[data-sound]").forEach(b => b.textContent = Sfx.muted ? "🔇" : "🔊"); }
document.querySelectorAll("[data-sound]").forEach(b => b.addEventListener("click", () => {
    Sfx.muted = !Sfx.muted; save.muted = Sfx.muted; persist(); syncSoundButtons(); Sfx.key();
}));
document.querySelectorAll("[data-svg]").forEach(el => { el.innerHTML = el.dataset.svg === "hero" ? SVG.hero() : monsterSVG(STAGES[0]); });
function jo(word, withB, withoutB) {   // 받침에 맞는 조사: jo("슬라임", "을", "를") → "슬라임을"
    const c = word.charCodeAt(word.length - 1);
    const hasB = c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 > 0;
    return word + (hasB ? withB : withoutB);
}
function vibrate(ms) {
    if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
    try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { /* 무시 */ }
}
function openSheet(html) { $("sheetBody").innerHTML = html; $("sheet").classList.add("on"); }
function closeSheet() { $("sheet").classList.remove("on"); }
$("sheet").addEventListener("click", (e) => { if (e.target.id === "sheet" || e.target.closest("[data-close]")) closeSheet(); });

function showTitle() {
    document.querySelector("#scr-title .scene-bg").innerHTML = sceneHTML(STAGES[0]);
    const g = save.grade;
    $("btnGrade").innerHTML = g == null ? `🎒 학년을 골라요 <small>▸</small>` : `${GRADES[g].icon} ${GRADES[g].short} <small>바꾸기 ▸</small>`;
    $("titleCoins").textContent = `🪙 ${fmt(save.coins)}`;
    const r = g == null ? null : rec(g);
    $("titleRecord").textContent = r && r.best ? `최고 기록: ${r.bestStage}스테이지 · ${fmt(r.best)}점${r.clears ? ` · 엔딩 ${r.clears}번` : ""}` : "용사님, 몬스터들이 나타났어요!";
    save.cycle = Math.min(save.cycle || 1, save.cycleUnlocked);
    $("cyclePick").hidden = save.cycleUnlocked < 2;
    $("cycleText").textContent = `${save.cycle}회차`;
    $("cycleDown").disabled = save.cycle <= 1;
    $("cycleUp").disabled = save.cycle >= save.cycleUnlocked;
    show("scr-title");
}
$("cycleDown").onclick = () => { save.cycle--; persist(); Sfx.key(); showTitle(); };
$("cycleUp").onclick = () => { save.cycle++; persist(); Sfx.key(); showTitle(); };
$("btnStart").onclick = () => {
    Sfx.turn();

let gradeThenStart = false;

    gradeThenStart = thenStart;
    $("grades").innerHTML = GRADES.map((g, i) => {
        const wide = i === 0 || i === GRADES.length - 1;
        return `<button class="${wide ? "wide" : ""}${save.grade === i ? " sel" : ""}" data-g="${i}"><span>${g.icon}</span>${g.name}</button>`;
    }).join("");
    show("scr-grade");
}

    const b = e.target.closest("[data-g]"); if (!b) return;
    save.grade = +b.dataset.g; persist();

    if (gradeThenStart) startRun(); else showTitle();
});

function showShop() {
    $("shopCoins").textContent = `🪙 ${fmt(save.coins)}`;
    $("shopList").innerHTML = `<div class="shop-note">모험에서 번 코인으로 영원히 강해져요!</div>` + SHOP.map(it => {
        const l = save.shop[it.id], maxed = l >= it.max, price = it.price(l);
        const now = shopValue[it.id](l), next = maxed ? "" : ` → ${shopValue[it.id](l + 1)}`;
        return `<div class="item panel">
            <div class="ic">${it.icon}</div>
            <div class="tx"><b>${it.name}</b><span>${it.per} · 지금 ${now}${next}</span>
                <div class="lv-dots">${Array.from({ length: it.max }, (_, k) => `<i class="${k < l ? "on" : ""}"></i>`).join("")}</div></div>
            <button class="btn gold" data-buy="${it.id}" ${maxed || save.coins < price ? "disabled" : ""}>${maxed ? "최대" : `🪙 ${fmt(price)}`}</button>
        </div>`;
    }).join("");
    show("scr-shop");
}
$("shopList").addEventListener("click", (e) => {
    const b = e.target.closest("[data-buy]"); if (!b) return;
    const it = SHOP.find(x => x.id === b.dataset.buy), l = save.shop[it.id], price = it.price(l);
    if (l >= it.max || save.coins < price) return;
    save.coins -= price; save.shop[it.id]++; persist();
    Sfx.coin(); toast(`${it.icon} ${it.name} 강화!`);
    showShop();
});
$("shopBack").onclick = () => { Sfx.key(); showTitle(); };

let run = null;
function newRun() {
    const sh = save.shop, g = save.grade;
    const ops = {};
    OP_KEYS.forEach(op => { ops[op] = GRADES[g].first.includes(op) ? gradeStart(g, op) : 0; });
    return {
        grade: g, cycle: save.cycle || 1, stage: 1, ops,
        maxHp: 100 + sh.hp * 20, hp: 100 + sh.hp * 20,
        atk: 20 + sh.atk * 4, def: sh.def * 2, critMult: 1.5 + sh.crit * .1, timeBonus: sh.time * .5,
        hitsNeeded: HITS_FOR_CRIT, hintBoost: false,
        guard: 0, shield: 0, reflect: 0, freeze: 0, vamp: 0, combo3: false,
        score: 0, stageScore: 0, correct: 0, combo: 0, maxCombo: 0, bonusCoins: 0,
    };
}
const activeOps = () => OP_KEYS.filter(op => run.ops[op] > 0);
const dmgMult = (op, level) => 1 + LEVEL_DMG_BONUS * Math.max(0, level - gradeStart(run.grade, op));

function startRun() {
    run = newRun();
    if (save.shop.gift) showGift(); else startStage();
}

/* =========================================================================
   전투
   ========================================================================= */
const B = {
    mon: null, monHp: 0, monMax: 0, monAtk: 0,
    phase: "idle",        // idle | ready | answer | busy
    hits: 0, turnNo: 0, queue: [], qi: 0, problem: null,
    limit: 10, time: 0, timer: null, paused: false,
    cells: [], cur: 0, dir: 1, memo: [], memoSel: -1,   // 답칸 · 세로셈 메모칸
    token: 0,             // 전투를 나가면 진행 중이던 연출을 멈추기 위한 표시
};
const alive = (tk) => tk === B.token && $("scr-battle").classList.contains("on");

function startStage() {
    B.token++;
    stopTimer();
    const st = STAGES[run.stage - 1], ms = monStats(run.stage, run.cycle);
    B.mon = st; B.monMax = ms.hp; B.monHp = ms.hp; B.monAtk = ms.atk;
    B.turnNo = 0; B.paused = false; B.problem = null; B.cells = []; B.memo = [];
    run.stageScore = 0; run.combo = 0;
    $("scene").querySelector(".scene-bg").innerHTML = sceneHTML(st);
    $("battleTitle").textContent = `STAGE ${run.stage}/${STAGE_COUNT} · ${st.place}`;
    $("monSvg").innerHTML = monsterSVG(st);
    $("monName").textContent = st.name;
    $("monActor").className = "actor monster";
    $("heroActor").className = "actor hero";
    $("question").innerHTML = ""; $("hint").textContent = ""; $("opTag").textContent = ""; $("secText").textContent = "";
    renderStats(); renderHp(true); renderCombo(); renderScore(); setTimerBar(1);
    B.hits = 0; renderDots();
    setPad(false);
    show("scr-battle");
    showReady();
}

function makeProblemFor(op) {
    const level = run.ops[op];
    const p = { op, level, hint: 0, ...LEVELS[op][level - 1].gen() };
    const boost = run.hintBoost && p.form !== "blank" && p.ans.length >= 3 ? 1 : 0;   // 💡 힌트 돋보기
    p.hints = Math.max(0, Math.min(p.ans.length - 1, p.hint + boost));
    p.exp = expectedTime(p, run.grade);
    return p;
}
function makeProblem(last) {
    const ops = activeOps();
    let p, tries = 0;
    do { p = makeProblemFor(pick(ops)); } while (last && p.full === last.full && ++tries < 6);
    return p;
}

/* 턴 시작 전 준비 카드 */
function showReady() {
    B.phase = "ready"; setPad(false);
    B.turnNo++;
    B.hits = 0; renderDots();
    B.queue = []; B.qi = 0;
    for (let i = 0; i < run.hitsNeeded; i++) B.queue.push(makeProblem(B.queue[i - 1]));
    const first = B.turnNo === 1;
    const opsRows = activeOps().map(op => {
        const lv = run.ops[op], o = OPS[op];
        // 문제마다 시간이 달라서 몇 개 뽑아 범위로 보여줌
        const ts = [...B.queue.filter(p => p.op === op), ...Array.from({ length: 8 }, () => makeProblemFor(op))]
            .map(p => timeLimit(p, run.stage, run.cycle, run.timeBonus));
        const lo = Math.min(...ts), hi = Math.max(...ts);
        const m = dmgMult(op, lv);
        return `<div class="r-op" style="--oc:${o.color}"><b>${o.icon} ${o.name} Lv${lv}</b><span>${LEVELS[op][lv - 1].desc}${m > 1 ? ` · 데미지 ×${m.toFixed(2)}` : ""}</span><em>⏱ ${lo === hi ? lo : `${lo}~${hi}`}초</em></div>`;
    }).join("");
    const extras = [run.guard && `🔰 ${run.guard}번 틀려도 괜찮아요`, run.freeze && `⏸️ 시간 멈춤 ${run.freeze}번`].filter(Boolean).join(" · ");
    $("ready").innerHTML = `<div class="ready-card panel">
        <div class="r-title">${first ? `${jo(B.mon.name, "이", "가")} 나타났다!` : `용사의 ${B.turnNo}번째 턴`}</div>
        <div class="r-sub">${first ? `❤️ ${B.monMax} · ⚔️ ${B.monAtk}` : `${B.mon.name} ❤️ ${B.monHp} / ${B.monMax}`}</div>
        <div class="r-queue">${B.queue.map((p, i) => `<span class="${i === B.queue.length - 1 ? "crit" : ""}" style="--oc:${OPS[p.op].color};animation-delay:${i * .06}s">${OPS[p.op].icon}</span>`).join("")}</div>
        <div class="r-ops">${opsRows}</div>
        <div class="r-tip">${run.hitsNeeded}번 맞히면 💥크리티컬! 틀리면 몬스터 차례예요${extras ? `<br>${extras}` : ""}</div>
        <button class="btn big pink" id="readyGo">준비됐어요! ▶</button>
    </div>`;
    $("ready").classList.add("on");
    const tk = B.token;
    $("readyGo").onclick = () => {
        if (!alive(tk) || B.phase !== "ready") return;
        $("ready").classList.remove("on");
        Sfx.turn();
        nextProblem(tk);
    };
}

function nextProblem(tk) {
    if (B.qi >= B.queue.length) B.queue.push(makeProblem(B.queue[B.queue.length - 1]));
    const p = B.problem = B.queue[B.qi];
    B.limit = timeLimit(p, run.stage, run.cycle, run.timeBonus);
    B.time = B.limit;
    setupCells(p);
    const o = OPS[p.op];
    $("opTag").textContent = `${o.icon} ${o.name} Lv${p.level}`;
    $("opTag").style.setProperty("--oc", o.color);
    $("hint").textContent = p.form === "v" ? "← 일의 자리부터 · 위 작은 칸은 메모용" : p.form === "blank" ? "□에 들어갈 숫자를 찾아요" : "";
    B.phase = "answer"; setPad(true);
    renderQuestion(); setTimerBar(1);
    startTimer(tk);
}

/* =========================================================================
   답칸 입력
   - 가로식·□ 찾기: 왼쪽 칸부터 채우고 오른쪽으로 이동, 끝나면 맨 앞의 빈칸으로
   - 세로셈: 일의 자리(오른쪽)부터 채우고 왼쪽으로 이동, 끝나면 맨 오른쪽의 빈칸으로
   - 칸을 누르면 그 칸부터. 힌트 칸은 건너뜀. 모든 칸이 차야 [확인]
   ========================================================================= */
const vWidth = (p) => Math.max(p.ans.length, ...p.terms.map(len));
function setupCells(p) {
    B.cells = p.ans.split("").map((d, i) => ({ d: i < p.hints ? d : null, hint: i < p.hints, res: "" }));
    B.dir = p.form === "v" ? -1 : 1;
    B.memo = p.form === "v" ? Array(vWidth(p)).fill(null) : [];
    B.memoSel = -1;
    B.cur = firstEmpty();
}
const editable = () => B.cells.map((_, i) => i).filter(i => !B.cells[i].hint);
const dirOrder = () => B.dir > 0 ? editable() : editable().reverse();
function firstEmpty() { const o = dirOrder(); const j = o.find(i => B.cells[i].d == null); return j ?? o[0]; }
const allFilled = () => B.cells.every(c => c.d != null);
function inputDigit(k) {
    const n = B.cells.length;
    B.cells[B.cur].d = k;
    let j = B.cur + B.dir;
    while (j >= 0 && j < n && B.cells[j].hint) j += B.dir;
    if (j < 0 || j >= n) j = dirOrder().find(i => B.cells[i].d == null) ?? B.cur;
    B.cur = j;
}
function backspace() {
    const n = B.cells.length;
    if (B.cells[B.cur].d != null) { B.cells[B.cur].d = null; return; }
    let j = B.cur - B.dir;
    while (j >= 0 && j < n && B.cells[j].hint) j -= B.dir;
    if (j >= 0 && j < n) { B.cur = j; B.cells[j].d = null; }
}
function moveCur(step) {   // 화살표 키: 화면 기준 왼쪽(-1) · 오른쪽(+1)
    const e = editable(), k = e.indexOf(B.cur) + step;
    if (k >= 0 && k < e.length) { B.cur = e[k]; B.memoSel = -1; renderQuestion(); }
}
$("question").addEventListener("click", (e) => {
    if (B.phase !== "answer" || B.paused) return;
    const m = e.target.closest(".memo");
    if (m) { B.memoSel = B.memoSel === +m.dataset.m ? -1 : +m.dataset.m; Sfx.key(); renderQuestion(); return; }
    const c = e.target.closest(".cell");
    if (c && !B.cells[+c.dataset.i].hint) { B.cur = +c.dataset.i; B.memoSel = -1; Sfx.key(); renderQuestion(); }
});
const answerText = (p) => p.form === "blank" ? p.full : p.ans;

function renderStats() {
    $("heroStat").textContent = `⚔️${run.atk} 🛡️${run.def}`;
    $("monStat").textContent = `⚔️${B.monAtk}`;
    const b = [
        run.guard && `🔰×${run.guard}`, run.shield && `🫧×${run.shield}`, run.reflect && `🪞×${run.reflect}`,
        run.freeze && `⏸️×${run.freeze}`, run.vamp && `🧛+${run.vamp}`, run.combo3 && "🔥콤보", run.hitsNeeded < HITS_FOR_CRIT && `🍀${run.hitsNeeded}`, run.hintBoost && "💡힌트",
    ].filter(Boolean);
    $("buffs").innerHTML = b.map(x => `<span>${x}</span>`).join("");
}
function renderHp(instant) {
    const hp = Math.max(0, run.hp) / run.maxHp * 100, mp = Math.max(0, B.monHp) / B.monMax * 100;
    $("heroFill").style.width = hp + "%"; $("monFill").style.width = mp + "%";
    const ghost = () => { $("heroGhost").style.width = hp + "%"; $("monGhost").style.width = mp + "%"; };
    instant ? ghost() : requestAnimationFrame(ghost);
    $("heroHpText").textContent = `${Math.max(0, run.hp)} / ${run.maxHp}`;
    $("monHpText").textContent = `${Math.max(0, B.monHp)} / ${B.monMax}`;
}
function renderDots() {
    let h = "";
    for (let i = 1; i <= run.hitsNeeded; i++) {
        const last = i === run.hitsNeeded;
        h += `<b class="${i <= B.hits ? "on" : ""}${last ? " last" : ""}">${last ? "💥" : "★"}</b>`;
    }
    $("dots").innerHTML = h;
}
function renderCombo(pop) {
    const c = $("combo");
    c.textContent = run.combo >= 2 ? `🔥${run.combo}콤보` : "";
    if (pop && run.combo >= 2) play(c, "pop", 300);
}
function renderScore(pop) { $("scoreText").textContent = `⭐ ${fmt(run.score)}`; if (pop) play($("scoreText"), "pop", 300); }
function cellHTML(i) {
    const c = B.cells[i];
    const cur = B.phase === "answer" && i === B.cur && B.memoSel < 0 && !c.hint;
    return `<button class="cell${c.hint ? " given" : ""}${c.res ? " " + c.res : ""}${cur ? " cur" : ""}" data-i="${i}">${c.d ?? ""}</button>`;
}
function renderQuestion() {
    const p = B.problem, el = $("question");
    if (!p) { el.innerHTML = ""; return; }
    let html, size = 0;
    if (p.form === "v") {
        const W = vWidth(p), pad = (n) => "<span></span>".repeat(Math.max(0, n));
        const row = (n) => pad(W - len(n)) + String(n).split("").map(d => `<span>${d}</span>`).join("");
        const memos = B.memo.map((m, c) => c === W - 1 ? "<span></span>" : `<button class="memo${B.memoSel === c ? " cur" : ""}" data-m="${c}">${m ?? ""}</button>`).join("");
        html = `<div class="vgrid" style="--cols:${W + 1}">
            <span></span>${memos}
            <span></span>${row(p.terms[0])}
            <span class="sym">${p.sym}</span>${row(p.terms[1])}
            <div class="vline"></div>
            <span></span>${pad(W - p.ans.length)}${B.cells.map((_, i) => cellHTML(i)).join("")}
        </div>`;
    } else if (p.form === "blank") {
        let k = 0;
        const tok = (t) => `<span class="tok">${p.parts[t].map(ch => ch === null ? cellHTML(k++) : ch).join("")}</span>`;
        html = `<div class="qh">${tok(0)}<span>${p.sym}</span>${tok(1)}<span>=</span>${tok(2)}</div>`;
        size = p.full.length;
    } else {
        html = `<div class="qh"><span>${p.q}</span><span>=</span><span class="cells">${B.cells.map((_, i) => cellHTML(i)).join("")}</span></div>`;
        size = p.q.length + p.ans.length * 1.4 + 2;
    }
    el.classList.toggle("long", size > 11 && size <= 16);
    el.classList.toggle("xlong", size > 16);
    el.innerHTML = html;
    document.querySelector(".key.ok").classList.toggle("wait", !allFilled());
}
function setPad(on) { $("pad").classList.toggle("off", !on); }
function setTimerBar(ratio) {
    $("timer").firstElementChild.style.width = Math.max(0, ratio) * 100 + "%";
    $("timer").classList.toggle("low", ratio <= .3 && ratio > 0);
    $("secText").textContent = B.problem ? `⏱ ${Math.max(0, B.time).toFixed(1)}초` : "";
}
function banner(text, color) {
    return new Promise(res => {
        const b = $("banner");
        b.firstElementChild.textContent = text;
        b.style.setProperty("--bb", color);
        play(b, "show", 1100);
        Sfx.turn();
        setTimeout(res, 1100);
    });
}

function startTimer(tk) {
    stopTimer();
    let lastSec = Math.ceil(B.time);
    B.timer = setInterval(() => {
        if (!alive(tk)) { stopTimer(); return; }
        if (B.paused || B.phase !== "answer") return;
        B.time -= .1;
        setTimerBar(B.time / B.limit);
        const sec = Math.ceil(B.time);
        if (sec !== lastSec) { lastSec = sec; if (sec <= 3 && sec > 0) Sfx.tick(); }
        if (B.time <= 0) miss(tk, true);
    }, 100);
}
function stopTimer() { clearInterval(B.timer); B.timer = null; }

function press(k) {
    if (B.phase !== "answer" || B.paused) return;
    if (k === "ok") {
        if (allFilled()) submit();
        else { play($("question"), "shake", 400); Sfx.wrong(); toast("빈칸을 모두 채워요!"); }
        return;
    }
    Sfx.key();
    if (B.memoSel >= 0) { B.memo[B.memoSel] = k === "del" ? null : k; B.memoSel = -1; }
    else if (k === "del") backspace();
    else inputDigit(k);
    renderQuestion();
}
$("pad").addEventListener("click", (e) => { const key = e.target.closest(".key"); if (key) press(key.dataset.k); });
document.addEventListener("keydown", (e) => {
    if (!$("scr-battle").classList.contains("on") || $("modal").classList.contains("on")) return;
    if (B.phase === "ready" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); $("readyGo")?.click(); return; }
    if (B.phase === "answer" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) { e.preventDefault(); moveCur(e.key === "ArrowLeft" ? -1 : 1); return; }
    let k = null;
    if (/^[0-9]$/.test(e.key)) k = e.key;
    else if (e.key === "Backspace") k = "del";
    else if (e.key === "Enter") k = "ok";
    if (!k) return;
    e.preventDefault();
    const btn = document.querySelector(`.key[data-k="${k}"]`);
    if (btn) play(btn, "down", 120);
    press(k);
});

function submit() {
    const tk = B.token, p = B.problem;
    B.phase = "busy"; setPad(false);
    B.cells.forEach((c, i) => { if (!c.hint) c.res = c.d === p.ans[i] ? "ok" : "bad"; });   // 자리마다 맞았는지 표시
    renderQuestion();
    if (B.cells.map(c => c.d).join("") === p.ans) onCorrect(tk);
    else miss(tk, false);
}

async function onCorrect(tk) {
    const p = B.problem;
    B.hits++; run.combo++; run.correct++;
    run.maxCombo = Math.max(run.maxCombo, run.combo);
    const crit = B.hits >= run.hitsNeeded;
    let dmg = run.atk * dmgMult(p.op, p.level);
    if (run.combo3 && run.combo % 3 === 0) dmg *= 2;
    if (crit) dmg *= run.critMult;
    dmg = Math.round(dmg);
    const pts = scoreFor(p.level, B.limit - B.time, p.exp, run.combo, run.cycle);
    run.score += pts; run.stageScore += pts;
    renderDots(); renderCombo(true); renderScore(true);
    $("hint").textContent = `+${fmt(pts)}점${run.combo3 && run.combo % 3 === 0 ? " 🔥불꽃 콤보!" : ""}`;
    Sfx.correct();
    await wait(200); if (!alive(tk)) return;

    play($("heroActor"), "lunge-r", 450);
    await wait(180); if (!alive(tk)) return;
    B.monHp = Math.max(0, B.monHp - dmg);
    crit ? Sfx.crit() : Sfx.hit();
    slashAt($("monActor"), crit);
    play($("monActor"), "ouch", 450);
    floatText($("monActor"), crit ? `💥${dmg}` : `-${dmg}`, crit ? "crit" : "");
    if (run.vamp && run.hp < run.maxHp) { heal(run, run.vamp); floatText($("heroActor"), `+${run.vamp}`, "heal"); }
    if (crit) { play($("flash"), "white", 350); play($("app"), "shake", 400); vibrate(60); }
    renderHp();
    await wait(crit ? 650 : 420); if (!alive(tk)) return;

    if (B.monHp <= 0) { stageClear(tk); return; }
    B.qi++;
    if (crit) {
        await banner("크리티컬!", "#f97316");
        if (!alive(tk)) return;
        monsterTurn(tk);
        return;
    }
    nextProblem(tk);
}

/* 오답 또는 시간 초과 */
async function miss(tk, timeout) {
    B.phase = "busy"; setPad(false);
    if (timeout && run.freeze > 0) {          // ⏸️ 시간 멈춤
        run.freeze--; renderStats();
        B.time = 5; B.limit = Math.max(B.limit, 5);
        Sfx.block(); toast("⏸️ 시간 멈춤! 5초 더!");
        B.phase = "answer"; setPad(true); renderQuestion();
        return;
    }
    run.combo = 0; renderCombo();
    if (timeout) { setTimerBar(0); renderQuestion(); }
    Sfx.wrong();
    if (run.guard > 0) {                      // 🔰 괜찮아 부적
        run.guard--; renderStats();
        $("hint").textContent = `🔰 괜찮아! 정답은 👉 ${answerText(B.problem)}`;
        await wait(1500); if (!alive(tk)) return;
        B.qi++;
        nextProblem(tk);
        return;
    }
    $("hint").textContent = `${timeout ? "시간이 다 됐어요!" : "아쉬워요!"} 정답은 👉 ${answerText(B.problem)}`;
    await wait(1500); if (!alive(tk)) return;
    monsterTurn(tk);
}

async function monsterTurn(tk) {
    B.phase = "busy"; setPad(false);
    await banner(`${B.mon.name}의 공격!`, "#dc2626");
    if (!alive(tk)) return;
    play($("monActor"), "lunge-l", 450);
    await wait(180); if (!alive(tk)) return;
    if (run.reflect > 0) {
        run.reflect--;
        B.monHp = Math.max(0, B.monHp - B.monAtk);
        Sfx.block();
        floatText($("heroActor"), "🪞 반사!", "heal");
        play($("monActor"), "ouch", 450);
        floatText($("monActor"), `-${B.monAtk}`, "");
    } else if (run.shield > 0) {
        run.shield--;
        Sfx.block();
        floatText($("heroActor"), "🫧 막았다!", "heal");
    } else {
        const dmg = Math.max(1, B.monAtk - run.def);
        run.hp = Math.max(0, run.hp - dmg);
        Sfx.hurt();
        play($("heroActor"), "ouch", 450);
        play($("flash"), "red", 450);
        play($("app"), "shake", 400);
        floatText($("heroActor"), `-${dmg}`, "");
        vibrate(120);
    }
    renderHp(); renderStats();
    await wait(800); if (!alive(tk)) return;
    if (B.monHp <= 0) { stageClear(tk); return; }
    if (run.hp <= 0) {
        $("heroActor").classList.add("dead");
        await wait(900); if (!alive(tk)) return;
        endRun("fallen");
        return;
    }
    showReady();
}

function slashAt(actor, crit) {
    const scene = $("scene"), r = actor.getBoundingClientRect(), sr = scene.getBoundingClientRect();
    const s = document.createElement("div");
    s.className = "slash" + (crit ? " crit" : "");
    const size = crit ? 170 : 130;
    s.style.left = (r.left - sr.left + r.width / 2 - size / 2) + "px";
    s.style.top = (r.top - sr.top + r.height / 2 - size / 2) + "px";
    scene.appendChild(s);
    setTimeout(() => s.remove(), 400);
    sparks(actor, crit ? 16 : 8, crit ? ["#fde047", "#f97316", "#fff"] : ["#fff", "#fde047"]);
}
function sparks(actor, count, colors) {
    const scene = $("scene"), r = actor.getBoundingClientRect(), sr = scene.getBoundingClientRect();
    const cx = r.left - sr.left + r.width / 2, cy = r.top - sr.top + r.height / 2;
    for (let i = 0; i < count; i++) {
        const d = document.createElement("div");
        d.className = "spark";
        const ang = Math.random() * Math.PI * 2, dist = 40 + Math.random() * 70;
        d.style.left = cx + "px"; d.style.top = cy + "px";
        d.style.background = pick(colors);
        d.style.setProperty("--dx", Math.cos(ang) * dist + "px");
        d.style.setProperty("--dy", Math.sin(ang) * dist + "px");
        scene.appendChild(d);
        setTimeout(() => d.remove(), 750);
    }
}
function floatText(actor, text, cls) {
    const scene = $("scene"), r = actor.getBoundingClientRect(), sr = scene.getBoundingClientRect();
    const f = document.createElement("div");
    f.className = "float " + cls;
    f.textContent = text;
    f.style.left = (r.left - sr.left + r.width / 2) + "px";
    f.style.top = (r.top - sr.top + r.height * .1) + "px";
    scene.appendChild(f);
    setTimeout(() => f.remove(), 1000);
}

$("btnQuit").onclick = async () => {
    Sfx.key();
    B.paused = true;
    const yes = await confirmBox("모험을 여기서 끝낼까요?\n지금까지 점수만큼 코인을 받아요.", "끝내기", "계속하기");
    B.paused = false;
    if (!yes || !$("scr-battle").classList.contains("on")) return;
    B.token++; B.phase = "idle"; stopTimer();
    endRun("quit");
};

/* =========================================================================
   스테이지 클리어 → 다음 스테이지 카드 고르기
   ========================================================================= */
async function stageClear(tk) {
    B.phase = "idle"; stopTimer();
    $("monActor").classList.add("dead");
    sparks($("monActor"), 22, [B.mon.c[0], B.mon.c[2], "#fde047", "#fff"]);
    Sfx.win();
    await wait(900); if (!alive(tk)) return;

    const r = rec(run.grade), st = run.stage;
    const newBest = run.stageScore > (r.stageBest[st] || 0);
    if (newBest) r.stageBest[st] = run.stageScore;
    persist();
    if (st >= STAGE_COUNT) { endRun("ending"); return; }

    const healed = Math.min(run.maxHp - run.hp, Math.round(run.maxHp * WIN_HEAL));
    heal(run, healed);

    // 연산 카드 3장: 최대 레벨이 아닌 연산 중 무작위
    const avail = shuffle(OP_KEYS.filter(op => run.ops[op] < MAX_LEVEL)).slice(0, 3);
    const choices = avail.map(op => {
        const cur = run.ops[op], isNew = cur === 0;
        const next = isNew ? gradeStart(run.grade, op) : cur + 1;
        const risk = isNew ? 2 : next - gradeStart(run.grade, op);
        return { op, cur, next, isNew, risk, ...rollReward(run, risk) };
    });
    const diffLabel = (risk) => risk >= 4 ? "아주 어려움 🔥🔥" : risk >= 2 ? "어려움 🔥" : "보통";

    overScreen(B.mon, `
        <h2>STAGE ${st} 클리어!</h2>
        <div class="sub">${jo(B.mon.name, "을", "를")} 물리쳤어요! 이번 스테이지 <b>${fmt(run.stageScore)}점</b>
            ${newBest ? `<span class="newrec">🏆 스테이지 최고 기록!</span>` : ""}
            ${healed ? `<br>❤️ 체력 ${healed} 회복` : ""}</div>
        <h4>다음 스테이지에 나올 문제와 보상을 골라요!</h4>
        <div class="choices" id="choices">${choices.map((c, k) => {
            const o = OPS[c.op];
            return `<button class="choice ${c.rar}" data-k="${k}">
                <span class="diff">${diffLabel(c.risk)}</span><span class="rar">${RARITY_NAME[c.rar]}</span>
                <div class="ch-op" style="--oc:${o.color}"><span class="ic">${o.icon}</span><b>${o.name}</b><small>${c.isNew ? "새로 추가!" : `Lv${c.cur} → ${c.next}`}</small></div>
                <div class="ch-rw"><span class="ic">${c.rw.icon}</span><div><b>${c.rw.name}</b><small>${descOf(c.rw, run)}</small></div></div>
                <div class="ch-desc">${o.icon} 다음 문제: ${LEVELS[c.op][c.next - 1].desc}</div>
            </button>`;
        }).join("")}</div>`, st === 1 ? 24 : 36);

    $("choices").onclick = (e) => {
        const b = e.target.closest(".choice"); if (!b) return;
        const c = choices[+b.dataset.k];
        run.ops[c.op] = c.next;
        c.rw.apply(run);
        Sfx.coin();
        run.stage++;
        startStage();
    };
}

/* 상점의 '출발 선물': 모험 시작 전에 희귀 이상 보상 1개 */
function showGift() {
    const picks = [], seen = new Set();
    while (picks.length < 3) {
        const c = rollReward(run, 2, "rare");
        if (seen.has(c.rw.name)) continue;
        seen.add(c.rw.name); picks.push(c);
    }
    overScreen(STAGES[0], `
        <h2>🎁 출발 선물</h2>
        <div class="sub">모험을 떠나기 전에 하나를 골라요!</div>
        <h4>${GRADES[run.grade].short} · ${run.cycle}회차</h4>
        <div class="choices" id="choices">${picks.map((c, k) => `<button class="choice gift ${c.rar}" data-k="${k}"><span class="rar">${RARITY_NAME[c.rar]}</span>
            <div class="ch-rw"><span class="ic">${c.rw.icon}</span><div><b>${c.rw.name}</b><small>${descOf(c.rw, run)}</small></div></div></button>`).join("")}</div>`, 0);
    $("choices").onclick = (e) => {
        const b = e.target.closest(".choice"); if (!b) return;
        picks[+b.dataset.k].rw.apply(run);
        Sfx.coin();
        startStage();
    };
}

/* =========================================================================
   모험 끝 (쓰러짐 · 그만둠 · 엔딩)
   ========================================================================= */
function endRun(reason) {
    B.phase = "idle"; stopTimer();
    const r = rec(run.grade);
    const ending = reason === "ending";
    const reached = ending ? STAGE_COUNT : run.stage;
    const coins = Math.floor(run.score / COIN_RATE) + run.bonusCoins;
    const newBest = run.score > r.best, newStage = reached > r.bestStage;
    if (newBest) r.best = run.score;
    if (newStage) r.bestStage = reached;
    if (ending) { r.clears++; save.cycleUnlocked = Math.min(MAX_CYCLE, Math.max(save.cycleUnlocked, run.cycle + 1)); }
    save.coins += coins;
    persist();

    const head = ending
        ? `<h2>🎉 마왕을 물리쳤어요!</h2><div class="sub">${run.cycle}회차 엔딩! 마을에 평화가 찾아왔어요.${run.cycle < MAX_CYCLE ? `<br><b>${run.cycle + 1}회차</b>가 열렸어요. 몬스터가 더 강해져요!` : ""}</div>`
        : `<h2>🏕️ 모험 끝!</h2><div class="sub">${reason === "quit" ? "모험을 잠시 쉬어요." : "용사가 지쳐서 마을로 돌아왔어요."}<br><b>${reached}스테이지</b>까지 갔어요!</div>`;
    overScreen(ending ? STAGES[STAGE_COUNT - 1] : B.mon || STAGES[0], `
        ${head}
        <div>${newBest ? `<span class="newrec">🏆 최고 점수!</span>` : ""}${newStage ? `<span class="newrec">🚩 최고 스테이지!</span>` : ""}</div>
        <div class="tally">
            <div class="wide">총 점수<b>⭐ ${fmt(run.score)}</b></div>
            <div>맞힌 문제<b>${run.correct}개</b></div>
            <div>최대 콤보<b>${run.maxCombo}</b></div>
        </div>
        <div class="coins-got">🪙 +${fmt(coins)}<small>점수 ${fmt(run.score)} ÷ ${COIN_RATE}${run.bonusCoins ? ` + 보너스 ${run.bonusCoins}` : ""} · 지금 ${fmt(save.coins)}코인</small></div>
        <div class="actions">
            <button class="btn gold" id="endShop">🛒 상점</button>
            <button class="btn pink" id="endAgain">🔁 다시 모험</button>
        </div>
        <button class="link" id="endHome">처음 화면으로</button>`, ending ? 80 : 0);
    ending ? Sfx.win() : Sfx.rest();
    setTimeout(() => Sfx.coin(), 600);
    $("endShop").onclick = () => { Sfx.key(); showShop(); };
    $("endAgain").onclick = () => { Sfx.turn(); startRun(); };
    $("endHome").onclick = () => { Sfx.key(); showTitle(); };
    run = null;
}

function overScreen(stage, html, confettiCount) {
    document.querySelector("#scr-over .scene-bg").innerHTML = sceneHTML(stage);
    const card = $("overCard");
    card.style.animation = "none"; void card.offsetWidth; card.style.animation = "";
    card.innerHTML = html;
    card.scrollTop = 0;
    show("scr-over");
    if (confettiCount) confetti(confettiCount);
}
function confetti(count) {
    const host = $("scr-over");
    const colors = ["#f43f5e", "#f5c542", "#22c55e", "#3b82f6", "#a855f7", "#fb923c"];
    for (let i = 0; i < count; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "%";
        c.style.background = pick(colors);
        c.style.animationDuration = 2.2 + Math.random() * 1.8 + "s";
        c.style.animationDelay = Math.random() * .8 + "s";
        c.style.borderRadius = Math.random() < .5 ? "50%" : "2px";
        host.appendChild(c);
        setTimeout(() => c.remove(), 5000);
    }
}

syncSoundButtons();
showTitle();
</script>
