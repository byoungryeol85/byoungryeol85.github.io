rules:`<div class="rules">
<p>위쪽 대포에서 조약돌을 쏘면 맞힌 블록에 불이 켜지고, 조약돌이 바닥으로 떨어지면 켜진 블록이 터지며 그 합계가 적에게 데미지로 들어갑니다. 터진 블록마다 코인도 얻습니다.</p>
<p><span class="dot" style="background:#e8332a"></span><b>빨간 블록</b>은 적의 코어입니다. 전부 부수면 적의 체력과 상관없이 처치되고, 마지막 코어를 맞힌 조약돌이 떨어지는 칸의 보물상자를 얻습니다.</p>
<p><span class="dot" style="background:#2b7bff"></span><b>파란 블록</b>은 개당 (기본 데미지 + 공격력)만큼 피해를 줍니다. <span class="dot" style="background:#9a3cff"></span><b>보라 블록</b>은 그 턴 데미지 배율을 올립니다. 깊은 층에는 한 번 더 맞혀야 하는 <b>강철 껍질</b> 블록이 나옵니다.</p>
<p>⚡ 게이지가 가득 차면 적이 기절해 반격하지 못합니다. 그렇지 않으면 적이 공격해 하트 1칸이 줄어듭니다. 스턴을 한 번 성공하면 보물상자에서 <b>특수 블록</b>을 부르는 핵이 나오기 시작합니다.</p>
<p>적이 <b style="color:#ff3b3b">분노</b>하면 한 턴 동안 힘을 모으고, 그다음 턴에 강공격을 합니다. 화면의 알림이 적의 다음 행동을 미리 알려주며, 그 사이에 스턴시키면 분노가 풀립니다.</p>
<p>2층부터 보스의 체력 게이지는 여러 겹입니다. 한 겹을 다 깎거나 코어를 모두 부수면 판이 새로 짜이고, 분노한 보스가 2턴 동안 힘을 모은 뒤 강공격합니다. 그 2턴이 공격 기회입니다.</p>
<p>적을 처치하면 하트 1칸, 보스를 쓰러뜨리고 다음 층으로 오르면 하트가 모두 회복됩니다. 항아리에 조약돌이 들어가도 1칸 회복합니다.</p>
<p>모은 코인은 메인 화면의 스킬 트리와 카드 뽑기에 씁니다. 10층 혼돈의 첨탑 꼭대기에 원정의 끝이 있습니다.</p></div>`,

rules:`<div class="rules">
<p>Fire the pebble from the cannon at the top. Pegs it hits light up, and when the pebble falls out, the lit pegs pop and their total hits the enemy as damage. Every popped peg also gives coins.</p>
<p><span class="dot" style="background:#e8332a"></span><b>Red pegs</b> are the enemy's cores. Break them all and the enemy falls no matter its health — and you win the chests in the slot where that last pebble lands.</p>
<p><span class="dot" style="background:#2b7bff"></span><b>Blue pegs</b> deal (base damage + attack) each. <span class="dot" style="background:#9a3cff"></span><b>Purple pegs</b> raise that turn's multiplier. Deeper floors have <b>steel-shell</b> pegs that need an extra hit.</p>
<p>Fill the ⚡ gauge to stun the enemy so it can't strike back. Otherwise it attacks and you lose a heart. After your first stun, chests start offering cores that summon <b>special pegs</b>.</p>
<p>An <b style="color:#ff3b3b">enraged</b> enemy gathers power for a turn, then hits hard on the next. On-screen notices warn you about its next move, and a stun in between calms it.</p>
<p>From floor 2, bosses have several stacked health bars. Empty one bar or break every core and the board resets; the enraged boss then gathers power for 2 turns before a heavy blow. Those 2 turns are your chance.</p>
<p>Defeating an enemy restores 1 heart, and climbing to the next floor restores them all. Landing the pebble in the pot also heals 1.</p>
<p>Spend coins on the Skill Tree and Card Draw from the main menu. The expedition ends atop the Spire of Chaos on floor 10.</p></div>`,

rules:`<div class="rules">
<p>上の大砲から小石を撃つと、当たったペグが光ります。小石が下に落ちると光ったペグがはじけ、その合計が敵へのダメージになります。はじけたペグごとにコインも手に入ります。</p>
<p><span class="dot" style="background:#e8332a"></span><b>赤ペグ</b>は敵のコアです。すべて壊すと敵のHPに関係なく撃破でき、最後のコアに当てた小石が落ちたマスの宝箱を獲得します。</p>
<p><span class="dot" style="background:#2b7bff"></span><b>青ペグ</b>は1個につき（基本ダメージ＋攻撃力）を与えます。<span class="dot" style="background:#9a3cff"></span><b>紫ペグ</b>はそのターンのダメージ倍率を上げます。深い階には、もう一度当てる必要がある<b>鋼鉄の殻</b>ペグが出てきます。</p>
<p>⚡ゲージが満タンになると敵は気絶し、反撃できません。そうでなければ敵が攻撃し、ハートが1つ減ります。一度スタンに成功すると、宝箱から<b>特殊ペグ</b>を呼ぶコアが出るようになります。</p>
<p>敵が<b style="color:#ff3b3b">怒る</b>と1ターン力をため、次のターンに強攻撃をします。画面の通知が敵の次の行動を前もって知らせ、その間にスタンさせると怒りが解けます。</p>
<p>2階からボスのHPゲージは何本も重なっています。1本を削り切るかコアをすべて壊すと盤面が組み直され、怒ったボスが2ターン力をためてから強攻撃します。その2ターンが攻めどきです。</p>
<p>敵を倒すとハートが1つ、ボスを倒して次の階へ上るとハートが全回復します。ツボに小石が入っても1つ回復します。</p>
<p>集めたコインはメイン画面のスキルツリーとカードガチャに使います。10階・混沌の尖塔の頂上に遠征の終わりがあります。</p></div>`,

rules:`<div class="rules">
<p>从上方的大炮发射石子，被击中的钉子会亮起；石子落到底部后，亮起的钉子会爆开，其总和会作为伤害打向敌人。每爆开一个钉子还能获得金币。</p>
<p><span class="dot" style="background:#e8332a"></span><b>红色钉</b>是敌人的核心。全部击碎后无论敌人剩多少体力都会被击败，并获得最后一颗石子落入格子里的宝箱。</p>
<p><span class="dot" style="background:#2b7bff"></span><b>蓝色钉</b>每个造成（基础伤害＋攻击力）的伤害。<span class="dot" style="background:#9a3cff"></span><b>紫色钉</b>会提高当回合的伤害倍率。较深的楼层会出现需要多击中一次的<b>钢壳</b>钉。</p>
<p>⚡槽充满后敌人会被眩晕，无法反击；否则敌人会攻击，你会失去1颗红心。成功眩晕一次后，宝箱里开始出现召唤<b>特殊钉</b>的核心。</p>
<p>敌人<b style="color:#ff3b3b">愤怒</b>后会先蓄力一回合，下一回合发动重击。画面提示会预告敌人的下一步行动，在此期间眩晕它即可解除愤怒。</p>
<p>从第2层起，首领的血条有好几层。打空一层或击碎全部核心后钉盘会重新布置，愤怒的首领会蓄力2回合后发动重击——这2回合就是进攻的机会。</p>
<p>击败敌人恢复1颗红心，击败首领登上下一层时红心全部恢复。石子落入罐子也能恢复1颗。</p>
<p>收集的金币可在主页的技能树和抽卡中使用。远征的终点在第10层混沌尖塔之巅。</p></div>`,

rules:`<div class="rules">
<p>從上方的大砲發射石子，被擊中的釘子會亮起；石子落到底部後，亮起的釘子會爆開，其總和會作為傷害打向敵人。每爆開一個釘子還能獲得金幣。</p>
<p><span class="dot" style="background:#e8332a"></span><b>紅色釘</b>是敵人的核心。全部擊碎後不論敵人剩多少體力都會被擊敗，並獲得最後一顆石子落入格子裡的寶箱。</p>
<p><span class="dot" style="background:#2b7bff"></span><b>藍色釘</b>每個造成（基礎傷害＋攻擊力）的傷害。<span class="dot" style="background:#9a3cff"></span><b>紫色釘</b>會提高當回合的傷害倍率。較深的樓層會出現需要多擊中一次的<b>鋼殼</b>釘。</p>
<p>⚡量表充滿後敵人會暈眩，無法反擊；否則敵人會攻擊，你會失去1顆紅心。成功暈眩一次後，寶箱裡開始出現召喚<b>特殊釘</b>的核心。</p>
<p>敵人<b style="color:#ff3b3b">憤怒</b>後會先蓄力一回合，下一回合發動重擊。畫面提示會預告敵人的下一步行動，在此期間讓牠暈眩即可解除憤怒。</p>
<p>從第2層起，頭目的血條有好幾層。打空一層或擊碎全部核心後釘盤會重新佈置，憤怒的頭目會蓄力2回合後發動重擊——這2回合就是進攻的機會。</p>
<p>擊敗敵人恢復1顆紅心，擊敗頭目登上下一層時紅心全部恢復。石子落入罐子也能恢復1顆。</p>
<p>收集的金幣可在主頁的技能樹和抽卡中使用。遠征的終點在第10層混沌尖塔之巔。</p></div>`,

rules:`<div class="rules">
<p>Dispara la bola desde el cañón de arriba. Los clavos que toca se encienden y, cuando la bola cae, revientan y su total golpea al enemigo como daño. Cada clavo reventado también da monedas.</p>
<p><span class="dot" style="background:#e8332a"></span>Los <b>clavos rojos</b> son los núcleos del enemigo. Si los rompes todos, cae sin importar su vida, y ganas los cofres de la casilla donde aterriza esa última bola.</p>
<p><span class="dot" style="background:#2b7bff"></span>Cada <b>clavo azul</b> hace (daño base + ataque). <span class="dot" style="background:#9a3cff"></span>Los <b>clavos morados</b> suben el multiplicador del turno. En pisos profundos aparecen clavos con <b>coraza de acero</b> que necesitan un golpe extra.</p>
<p>Llena la barra ⚡ para aturdir al enemigo y que no pueda contraatacar. Si no, ataca y pierdes un corazón. Tras tu primer aturdimiento, los cofres empiezan a ofrecer núcleos que invocan <b>clavos especiales</b>.</p>
<p>Un enemigo <b style="color:#ff3b3b">furioso</b> acumula poder un turno y golpea fuerte en el siguiente. Los avisos en pantalla anuncian su próximo movimiento, y aturdirlo entre medias le quita la furia.</p>
<p>Desde el piso 2, los jefes tienen varias barras de vida. Vacía una barra o rompe todos los núcleos y el tablero se reinicia; el jefe furioso acumula poder 2 turnos antes de un golpe brutal. Esos 2 turnos son tu oportunidad.</p>
<p>Derrotar a un enemigo recupera 1 corazón, y subir al siguiente piso los recupera todos. Meter la bola en la vasija también cura 1.</p>
<p>Gasta las monedas en el Árbol de habilidades y los Sobres desde el menú principal. La expedición termina en la cima de la Aguja del Caos, en el piso 10.</p></div>`,

rules:`<div class="rules">
<p>위에 떠 있는 수달이 조약돌을 던지면 맞힌 블록에 불이 켜지고, 조약돌이 바닥으로 떨어지면 켜진 블록이 터지며 그 합계가 적에게 데미지로 들어갑니다. 터진 블록마다 코인도 얻습니다.</p>
<p><span class="dot" style="background:#e8332a"></span><b>빨간 블록</b>은 적의 코어입니다. 전부 부수면 적의 체력과 상관없이 처치되고, 마지막 코어를 맞힌 조약돌이 떨어지는 칸의 보물상자를 얻습니다.</p>
<p><span class="dot" style="background:#2b7bff"></span><b>파란 블록</b>은 개당 (기본 데미지 + 공격력)만큼 피해를 줍니다. <span class="dot" style="background:#9a3cff"></span><b>보라 블록</b>은 그 턴 데미지 배율을 올립니다. 뒤쪽 스테이지에는 한 번 더 맞혀야 하는 <b>강철 껍질</b> 블록이 나옵니다.</p>
<p>⚡ 게이지가 가득 차면 적이 기절해 반격하지 못합니다. 적이 <b style="color:#ff3b3b">분노</b>하면 한 턴 힘을 모은 뒤 강공격하며, 화면 알림이 미리 알려줍니다.</p>
<p>보스의 체력은 두세 겹입니다. 첫 겹에서 코어를 모두 부수면 바닥 칸이 <b>공격 기회 턴</b>이 되어, 다음 페이즈에서 보스가 그만큼 반격하지 못합니다.</p>
<p>조개에 조약돌이 들어가면 하트를 보관했다가 공격 직전에 하트 칸으로 날려 회복합니다. 적을 처치해도 하트 1칸을 회복합니다.</p>
<p>한 스테이지는 13칸짜리 지도입니다. 보스를 쓰러뜨리면 스테이지 클리어! 원정 강화는 초기화되고 로비로 돌아가며, 다음 스테이지가 열립니다. 코인은 스킬 트리, 동료 뽑기, 꾸미기에 씁니다.</p></div>`
},

rules:`<div class="rules">
<p>The otter floating at the top flicks a pebble. Pegs it hits light up, and when the pebble falls out, the lit pegs pop and their total hits the enemy. Every popped peg also gives coins.</p>
<p><span class="dot" style="background:#e8332a"></span><b>Red pegs</b> are the enemy's cores. Break them all and the enemy falls no matter its health, and you win the chests in the slot where that last pebble lands.</p>
<p><span class="dot" style="background:#2b7bff"></span><b>Blue pegs</b> deal (base damage + attack) each. <span class="dot" style="background:#9a3cff"></span><b>Purple pegs</b> raise that turn's multiplier. Later stages have <b>steel-shell</b> pegs that need an extra hit.</p>
<p>Fill the ⚡ gauge to stun the enemy so it can't strike back. An <b style="color:#ff3b3b">enraged</b> enemy gathers power for a turn, then hits hard, and on-screen notices warn you first.</p>
<p>Bosses have two or three health bars. Break every core on the first bar and the bottom slots turn into <b>free turns</b>: the boss can't strike back for that many turns in the next phase.</p>
<p>Drop the pebble into the clam to save a heart; it flies to your heart bar right before your attack. Defeating an enemy also heals 1 heart.</p>
<p>Each stage is a 13-step map. Beat the boss for a Stage Clear! Your run upgrades reset, you return to the lobby, and the next stage opens. Spend coins on the Skill Tree, Friend Draw and Style.</p></div>`

rules:`<div class="rules">
<p>上に浮かぶカワウソが小石を投げると、当たったペグが光ります。小石が下に落ちると光ったペグがはじけ、その合計が敵へのダメージになります。はじけたペグごとにコインも手に入ります。</p>
<p><span class="dot" style="background:#e8332a"></span><b>赤ペグ</b>は敵のコアです。すべて壊すと敵のHPに関係なく撃破でき、最後のコアに当てた小石が落ちたマスの宝箱を獲得します。</p>
<p><span class="dot" style="background:#2b7bff"></span><b>青ペグ</b>は1個につき（基本ダメージ＋攻撃力）を与えます。<span class="dot" style="background:#9a3cff"></span><b>紫ペグ</b>はそのターンの倍率を上げます。後半のステージには、もう一度当てる必要がある<b>鋼鉄の殻</b>ペグが出てきます。</p>
<p>⚡ゲージが満タンになると敵は気絶して反撃できません。敵が<b style="color:#ff3b3b">怒る</b>と1ターン力をためてから強攻撃し、画面の通知が前もって知らせます。</p>
<p>ボスのHPは2〜3本です。1本目でコアをすべて壊すと、下のマスが<b>攻撃チャンスのターン数</b>になり、次のフェーズでボスがその分反撃できません。</p>
<p>貝に小石が入るとハートをキープし、攻撃の直前にハート欄へ飛んで回復します。敵を倒してもハートが1つ回復します。</p>
<p>1ステージは13マスの地図です。ボスを倒せばステージクリア！遠征強化はリセットされてロビーに戻り、次のステージが解放されます。コインはスキルツリー、なかまガチャ、きせかえに使います。</p></div>`

<p><span class="dot" style="background:#e8332a"></span><b>红色钉</b>是敌人的核心。全部击碎后无论敌人剩多少体力都会被击败，并获得最后一颗石子落入格子里的宝箱。</p>

<p>石子落入贝壳会保存一颗红心，并在攻击前飞向红心栏恢复。击败敌人也会恢复1颗红心。</p>

<p><span class="dot" style="background:#e8332a"></span>Los <b>clavos rojos</b> son los núcleos del enemigo. Si los rompes todos, cae sin importar su vida, y ganas los cofres de la casilla donde aterriza ese último guijarro.</p>
<p><span class="dot" style="background:#2b7bff"></span>Cada <b>clavo azul</b> hace (daño base + ataque). <span class="dot" style="background:#9a3cff"></span>Los <b>clavos morados</b> suben el multiplicador del turno. Las fases avanzadas tienen clavos con <b>coraza de acero</b> que necesitan un golpe extra.</p>
<p>Llena la barra ⚡ para aturdir al enemigo y que no pueda contraatacar. Un enemigo <b style="color:#ff3b3b">furioso</b> acumula poder un turno y luego golpea fuerte; los avisos en pantalla te lo anuncian.</p>
<p>Los jefes tienen dos o tres barras de vida. Si rompes todos los núcleos en la primera barra, las casillas del fondo se convierten en <b>turnos libres</b>: el jefe no podrá contraatacar durante esos turnos en la siguiente fase.</p>
<p>Si el guijarro entra en la almeja, guarda un corazón que vuela a tu barra justo antes de atacar. Derrotar a un enemigo también cura 1 corazón.</p>
<p>Cada fase es un mapa de 13 pasos. ¡Vence al jefe y la superas! Las mejoras de la expedición se reinician, vuelves al vestíbulo y se abre la siguiente fase. Gasta monedas en el Árbol de habilidades, Invocar amigos y Estilo.</p></div>`
}

function musicInit(){if(!AC||musicGain)return;musicGain=AC.createGain();musicGain.gain.value=0;musicGain.connect(comp);}
const midi=n=>440*Math.pow(2,(n-69)/12);
function mt(f,t,dur,type,vol){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+dur+0.05);}
function mn(t,dur,vol,freq,hp){if(!nbuf)return;const s=AC.createBufferSource();s.buffer=nbuf;const f=AC.createBiquadFilter();f.type=hp?'highpass':'lowpass';f.frequency.value=freq;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(musicGain);s.start(t,Math.random()*0.5);s.stop(t+dur+0.02);}
function mkick(t,v=0.8){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+0.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+0.22);}
const SONGS={
  menu:{bpm:94,root:50,prog:[[0,4,7],[-3,0,4],[-7,-3,0],[-5,-1,2]],scale:[0,2,4,7,9],drums:'soft',lead:'triangle',seed:3},
  battle:{bpm:128,root:45,prog:[[0,3,7],[-4,0,3],[-7,-4,0],[-2,2,5]],scale:[0,3,5,7,10],drums:'beat',lead:'square',seed:7},

  fever:{bpm:160,root:52,prog:[[0,4,7],[5,9,12],[7,11,14],[0,4,7]],scale:[0,2,4,7,9],drums:'beat',lead:'square',seed:5}

function buildPat(S){let sd=S.seed*9301;const r=()=>{sd=(sd*9301+49297)%233280;return sd/233280;};
  return S.prog.map(ch=>Array.from({length:8},(_,s)=>{if(s%2&&r()<0.35)return null;if(r()<0.12)return null;
    return r()<0.55?ch[Math.floor(r()*3)]+12:S.scale[Math.floor(r()*S.scale.length)]+12;}));}
function musicWanted(){
  if(state==='menu'||state==='mapview'||!enemy)return'menu';
  if(turn&&turn.fever)return'fever';
  return enemy.rank==='boss'?'boss':'battle';
}
function musicTick(){
  if(!AC||!musicGain)return;
  musicGain.gain.value=!cfg.bgm?0:0.17;
  mus.want=musicWanted();
  const now=AC.currentTime;if(mus.next<now)mus.next=now+0.06;
  while(mus.next<now+0.25){
    if(mus.step%8===0&&mus.song!==mus.want){mus.song=mus.want;mus.pat=buildPat(SONGS[mus.song]);mus.step=0;}
    const S=SONGS[mus.song],t=mus.next,s=mus.step%8,bar=Math.floor(mus.step/8)%4,ch=S.prog[bar],e8=60/S.bpm/2;
    if(musicGain.gain.value>0){
      mt(midi(S.root-12+ch[0]+(s%2?12:0)),t,e8*0.9,S.drums==='heavy'?'square':'triangle',S.drums==='heavy'?0.09:0.2);
      if(s===0)ch.forEach(n=>mt(midi(S.root+12+n),t,e8*7.6,'triangle',0.045));
      const nt=mus.pat[bar][s];if(nt!==null)mt(midi(S.root+12+nt),t,e8*(s%2?0.9:1.6),S.lead,S.lead==='triangle'?0.09:0.045);
      if(S.drums!=='soft'&&s%2===1)mt(midi(S.root+24+ch[(s>>1)%3]),t,e8*0.6,'sine',0.04);
      if(S.drums==='soft'){if(s===0)mkick(t,0.45);if(s===4)mn(t,0.05,0.05,7000,true);}
      else{if(s===0||s===4||(S.drums==='heavy'&&(s===3||s===6)))mkick(t,0.8);if(s===2||s===6)mn(t,0.14,0.22,1800,false);mn(t,0.03,s%2?0.05:0.08,8000,true);}
    }
    mus.next+=e8;mus.step++;
  }
}

  const d=defMeta();for(const k in d)if(m[k]===undefined)m[k]=d[k];

  for(const c of CARDS){const s=meta.cards[c.id];if(s&&s.lv>0){if(c.pas==='dmg')dmg+=s.lv;else coin+=s.lv;}}

function addCard(c){
  const s=meta.cards[c.id]||(meta.cards[c.id]={lv:0,cp:0});
  if(s.lv===0){s.lv=1;s.cp=0;return'NEW';}
  if(s.lv>=5){const r=REFUND[c.r];meta.coins+=r;return'+'+r+'🪙';}
  s.cp++;const need=LV_NEED[c.r][s.lv-1];
  if(s.cp>=need){s.cp-=need;s.lv++;return'LV UP';}
  return'+1';
}

  const along=(x1,y1,x2,y2,n,br)=>{const a=Math.atan2(y2-y1,x2-x1);for(let k=0;k<n;k++){const t=n>1?k/(n-1):0,x=lerp(x1,x2,t),y=lerp(y1,y2,t);br?B(x,y,a):C(x,y);}};

      C(cx,cy);for(let k=-4;k<=4;k++)C(240+k*45,345);[[50,740],[95,772],[50,400]].forEach(([x,y])=>C(x,y));break;
    case'arcs':for(let i=0;i<6;i++){const y0=362+i*74,cvv=(i%2?1:-1)*36;for(let k=0;k<9;k++){const t=k/8,x=56+t*(W-112),u=2*t-1,y=y0+cvv*(1-u*u),sl=cvv*(-2*u)*2/(W-112);B(x,y,Math.atan(sl));}}break;
    case'diamond':for(let i=-7;i<=7;i++)for(let j=-7;j<=7;j++){const m=Math.abs(i)+Math.abs(j);if(m>7||((i+j)&1)||m<2)continue;C(cx+i*30,cy+j*29);}B(cx,cy,0);break;

      for(let k=-3;k<=3;k++)C(240+k*48,340);break;
    case'waves':for(let r=0;r<7;r++){const y0=352+r*66,ph=r*0.9;for(let k=-5;k<=5;k++){const x=240+k*36,y=y0+16*Math.sin(Math.abs(x-240)/42+ph),sl=16/42*Math.cos(Math.abs(x-240)/42+ph)*Math.sign(x-240);(r%2)?C(x,y):B(x,y,Math.atan(sl));}}break;
    case'chevron':for(let r=0;r<8;r++){const y0=336+r*58;for(let k=-5;k<=5;k++){const x=240+k*38,y=y0+(5-Math.abs(k))*7*(r%2?1:-1)+(r%2?0:35);C(x,y);}}break;

// ============ PHYSICS ============
function pegNear(p,x,y){
  if(p.shape==='c')return[p.x,p.y,p.big||PEG_R];
  const c=Math.cos(p.ang)*BRICK_L/2,s=Math.sin(p.ang)*BRICK_L/2,ax=p.x-c,ay=p.y-s,dx=2*c,dy=2*s;
  const t=clamp(((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy),0,1);return[ax+dx*t,ay+dy*t,BRICK_R];
}
function bounceOff(b,px,py,R,e){
  const dx=b.x-px,dy=b.y-py,rr=R+b.r,d2=dx*dx+dy*dy;if(d2>=rr*rr)return 0;
  const d=Math.sqrt(d2)||0.001,nx=dx/d,ny=dy/d;b.x=px+nx*rr;b.y=py+ny*rr;
  const vn=b.vx*nx+b.vy*ny;
  if(vn<0){b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;return -vn;}
  return 0.001;
}
function hitPeg(p,b,imp){

  if(b.canSplit){b.canSplit=false;
    if(Math.random()<player.twin&&balls.length<5){const nb=mkBall(b.x,b.y,-b.vx*0.95,b.vy);nb.canSplit=false;nb.pierce=0;balls.push(nb);
      burst(b.x,b.y,'#d08aff',14,200,'b',2.6,0);float(b.x,b.y-20,tx('split'),'#e0b0ff',16,'b',0.8);sfx.zap();}}
  if(!p.lit)lightPeg(p,b);else if(imp>60)sfx.tick();
  if(p.hc>12)earlyPop(p);
}
function lastRed(){let last=null,cnt=0;for(const p of stage.pegs)if(p.alive&&p.color==='red'&&!p.lit){cnt++;last=p;if(cnt>1)return null;}return last;}
const PH=1/600;
// one fixed physics step, shared by the real ball and the aim guide so both follow identical rules
function moveBall(b,h,onHit,onPierce,pegs=stage.pegs,bounce=player.bounce){
  b.vy+=G*h;b.x+=b.vx*h;b.y+=b.vy*h;
  if(b.x<WALL_L+b.r){b.x=WALL_L+b.r;b.vx=Math.abs(b.vx)*0.92;}
  if(b.x>WALL_R-b.r){b.x=WALL_R-b.r;b.vx=-Math.abs(b.vx)*0.92;}
  if(b.y<BT+b.r){b.y=BT+b.r;b.vy=Math.abs(b.vy)*0.9;}
  for(const p of pegs){
    if(!p.alive||b.ghosted.has(p)||Math.abs(p.x-b.x)>32||Math.abs(p.y-b.y)>32)continue;
    const[px,py,R]=pegNear(p,b.x,b.y);const dx=b.x-px,dy=b.y-py;
    if(dx*dx+dy*dy>=(R+b.r)*(R+b.r))continue;
    const lit=p.lit||(b.sl&&b.sl.has(p)),arm=p.armor&&!(b.sb&&b.sb.has(p));
    if(b.pierce>0&&!lit&&!arm){b.pierce--;b.ghosted.add(p);if(onPierce&&onPierce(p))return true;continue;}
    const imp=bounceOff(b,px,py,R,bounce);
    if(imp>0&&onHit&&onHit(p,imp))return true;
  }
  return false;
}
function stepBall(b,h,lr){
  if(lr){const dx=lr.x-b.x,dy=lr.y-b.y,d=Math.hypot(dx,dy);if(d<170&&d>1){b.vx+=dx/d*player.homing*h;b.vy+=dy/d*player.homing*h;}}
  moveBall(b,h,(p,imp)=>{hitPeg(p,b,imp);return b.dead;},p=>{parts.push({x:p.x,y:p.y,vx:0,vy:0,life:0.4,max:0.4,col:'#e8e0ff',size:8,g:0,layer:'b',ring:true});lightPeg(p,b);return b.dead;});

// Monte-Carlo replay of the rest of the current fight with the real peg physics.
// "random" fires at random angles; "aimed" tries 5 angles each turn and keeps the best (a decent player).
const SIM_H=1/240;
const simPegDmg=(p,P)=>p.color==='red'?(P.blueBase+P.atk)*2+P.redBonus:P.blueBase+P.atk;
const simPeg=p=>({x:p.x,y:p.y,shape:p.shape,ang:p.ang,color:p.color,armor:p.armor,alive:p.alive,purple:false,hc:0,lit:false});
function simShot(pegs,P,ang,boss){
  const b={x:LX+Math.cos(ang)*28,y:LY+Math.sin(ang)*28,vx:Math.cos(ang)*LAUNCH_V,vy:Math.sin(ang)*LAUNCH_V,r:P.ballR,pierce:0,ghosted:new Set()};
  let tm=0,hits=0,purple=0,fever=false,slowT=0;const lit=[];
  const light=p=>{if(p.lit)return;p.lit=true;lit.push(p);hits++;if(p.purple)purple++;
    if(p.color==='red'&&!fever&&!pegs.some(q=>q.alive&&q.color==='red'&&!q.lit))fever=true;};
  const onHit=(p,imp)=>{p.hc++;if(p.armor){if(imp>25)p.armor=false;if(p.hc>14)p.alive=false;return false;}light(p);if(p.hc>12)p.alive=false;return false;};
  while(tm<16){
    moveBall(b,SIM_H,onHit,null,pegs,P.bounce);tm+=SIM_H;
    if(b.y>H+b.r+4)break;
    const sp=Math.hypot(b.vx,b.vy);if(sp>950){b.vx*=950/sp;b.vy*=950/sp;}
    if(sp<45){slowT+=SIM_H;if(slowT>1){slowT=0;let best=null,bd=44;for(const p of pegs){if(!p.alive)continue;const d=Math.hypot(p.x-b.x,p.y-b.y);if(d<bd){bd=d;best=p;}}if(best){light(best);best.alive=false;}}}else slowT=0;
  }
  let sum=0;for(const p of lit)sum+=simPegDmg(p,P);
  if(fever)for(const p of pegs)if(p.alive&&!p.lit)sum+=simPegDmg(p,P);
  let m=(1+Math.floor(hits/5)*P.comboStep+purple*P.purpleVal)*P.dmgMul*(boss?1+P.bossDmg:1);
  if(P.dice)m*=rnd(0.5,P.dice);
  return{dmg:Math.round(sum*m),fever,stun:hits>=P.stunNeed,hits};
}

function* simFight(S,aimed){
  const P=S.P,E={...S.E};let pegs=S.pegs.map(simPeg),hearts=S.hearts,sh=S.shield,und=S.undying,phx=S.phoenix;
  const layerDown=()=>{if(E.phase<E.phases){E.phase++;E.maxHp=E.layers[E.phase-1];E.hp=E.maxHp;E.rageT=3;E.halfRaged=true;pegs=buildStage('boss').pegs.map(simPeg);return false;}return true;};
  for(let turn=0;turn<40;turn++){
    for(const p of pegs)p.purple=false;
    const blues=shuffle(pegs.filter(p=>p.alive&&p.color==='blue'&&!p.armor));for(let i=0;i<Math.min(P.purples,blues.length);i++)blues[i].purple=true;
    let best=null,bestPegs=null,bs=-1;
    for(let k=0;k<(aimed?5:1);k++){
      const trial=pegs.map(p=>({...p,hc:0,lit:false}));const r=simShot(trial,P,rnd(0.12,Math.PI-0.12),E.boss);
      const sc=r.dmg+(r.fever?1e9:0)+(r.stun&&E.hp>r.dmg?E.maxHp*0.25:0);

    E.hp-=best.dmg;if(best.fever)E.hp=0;
    if(E.hp<=0||!pegs.some(p=>p.alive&&p.color==='red')){if(layerDown())return true;continue;}
    if(best.stun){E.rageT=0;continue;}
    if(E.rageT>1){E.rageT--;E.turns++;continue;}
    const d=E.rageT===1?E.rageDmg:1;E.rageT=0;E.turns++;
    if(sh>0)sh--;else{hearts-=d;if(P.thorns)E.hp-=P.atk*P.thorns;
      if(hearts<=0){if(und>0){und--;hearts=1;}else if(phx>0){hearts=phx;phx=0;}else return false;}}
    if(E.hp<=0){if(layerDown())return true;continue;}
    if(E.rageEvery&&E.turns%E.rageEvery===0)E.rageT=2;
    if(!E.halfRaged&&E.hp<E.maxHp*0.5&&E.phase===E.phases){E.halfRaged=true;E.rageT=2;}
  }
  return false;
}

  const avail=UPG.filter(u=>u.r>=minR&&(!u.avail||u.avail(player))&&(!u.offer||Math.random()<u.offer)&&(!u.cap||(run.ups[u.id]||0)<u.cap)&&(!u.sp||(!player.sp[u.sp]&&run.stuns>0))),out=[];let leg=0,hi=0;

  else if(a==='coin'){meta.coins+=10000;saveMeta();if(reRender&&state==='menu')reRender();}
  else if(a==='reset'){
    if(state==='mapview'){run.map=genMap();run.row=-1;run.col=0;run.node=0;showMap();}
    else if(stage&&state==='aim'){const pot=stage.pot;stage=buildStage(enemy.rank==='boss'?'boss':run.lastKind);stage.pot=pot;newTurn(true);odds.turnRef=null;}
  }else if(a==='win'){
    if(state==='mapview'){run.lastKind='boss';afterRewards();}
    else if(stage&&stage.bonus){timers.length=0;balls=[];bAnim=null;res=null;tsTarget=1;camT.x=BCX;camT.y=BCY;camT.z=1;stage.dbgWin=true;if(turn)turn.fever=false;bonusEnd();}
    else if(enemy&&!enemy.dead){timers.length=0;balls=[];bAnim=null;res=null;if(turn){turn.fever=false;turn.chests=0;}tsTarget=1;camT.x=BCX;camT.y=BCY;camT.z=1;enemy.phase=enemy.phases;enemy.hp=0;enemyDie();}
  }
  dbgDirty=true;
}
// ---------- click routing ----------
ov.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;audioInit();const act=b.dataset.act;
  if(act!=='pick')sfx.select();
  switch(act){
    case'title':showTitle();break;
    case'rules':showRules();break;
    case'begin':beginRun(pendingMode);break;
    case'stPrev':meta.sel=Math.max(1,(meta.sel||1)-1);showTitle();break;
    case'stNext':meta.sel=Math.min(MAXF,(meta.sel||1)+1);showTitle();break;
    case'go':case'goHell':case'goGrand':pendingMode=act==='go'?'normal':act==='goHell'?'hell':'grand';if(meta.runs===0)showRules();else beginRun(pendingMode);break;
    case'info':showInfo();break;
    case'style':pv=null;showStyle();break;
    case'pv':audioInit();pvStart(b.dataset.id,true);break;
    case'useBall':meta.ball=b.dataset.id;saveMeta();showStyle();break;
    case'useSnd':meta.snd=SND_OF[b.dataset.id];saveMeta();pvStart(b.dataset.id,true);showStyle();break;
    case'buySet':{const st=SETS.find(x=>x.id===b.dataset.id);if(meta.coins<st.cost){sfx.deny();break;}meta.coins-=st.cost;meta.sets.push(st.id);sfx.buy();saveMeta();showStyle();break;}
    case'evc':evChoose(+b.dataset.i);break;
    case'finish':afterRewards();break;
    case'spin':spinSlot(+b.dataset.i);break;
    case'mapHelp':showMapHelp();break;
    case'att':showAtt();break;
    case'attClaim':attClaim();break;
    case'notice':ntOpen=1;showNotice();break;
    case'ntToggle':{ntOpen=ntOpen===+b.dataset.id?0:+b.dataset.id;const m=modal;modal=null;showNotice();modal=m;break;}
    case'resume':audioInit();resumeRun();break;
    case'buyItem':buyItem(+b.dataset.i);break;
    case'open':showPick();break;
    case'pick':{const u=curOpts[+b.dataset.i];if(!u)return;sfx.select();u.apply(player);clampPlayer(player);run.ups[u.id]=(run.ups[u.id]||0)+1;run.picks--;if(run.picks>0)showPick();else afterRewards();break;}
    case'map':showMap();break;
    case'mapnode':if(lpFired){lpFired=false;break;}enterNode(+b.dataset.r,+b.dataset.j);break;
    case'giveup':showOverlay(`<div class="panel"><div class="ttl sm">${tx('giveUpQ')}</div><p class="sub">${tx('giveUpMsg',{c:fmt(run.coins)})}</p><div class="btnrow"><button class="btn sm" data-act="confirmGiveup">${tx('giveUpYes')}</button><button class="btn alt sm" data-act="map">${tx('keepGoing')}</button></div></div>`);break;
    case'confirmGiveup':clearRun();showTitle();break;
    case'tree':showTree();break;
    case'skill':selSkill=b.dataset.id;showTree();break;
    case'buy':buySkill();break;
    case'cards':showCards();break;
    case'card':selCard=b.dataset.id;if(meta.cards[selCard]&&meta.cards[selCard].lv>0)sfx.select();showCards();break;
    case'equip':meta.equip=selCard;saveMeta();sfx.buy();showCards();break;
    case'gacha':showGacha();break;
    case'pull1':pull(1);break;
    case'pull10':pull(10);break;
    case'closeModal':closeModal();break;
    case'helpIn':modal&&(paused=true);showOverlay(`<div class="panel">${panelTtl('rulesTitle')}${tx('rules')}<button class="btn" data-act="backSettings">${tx('back')}</button></div>`,'help');break;
    case'backSettings':{const m=modal;modal=null;showSettings();modal=m;break;}
    case'lang':setLang(b.dataset.l);{const m=modal;modal=null;showSettings();modal=m;}break;
    case'tBgm':cfg.bgm=!cfg.bgm;applyCfg();{const m=modal;modal=null;showSettings();modal=m;}break;
    case'sSnd':meta.snd=SND_OF[b.dataset.id];saveMeta();audioInit();[1,4,8].forEach((n,k)=>setTimeout(()=>sfx.hit(n,W/2),k*220));{const m=modal;modal=null;showSettings();modal=m;}break;
    case'sBall':meta.ball=b.dataset.id;saveMeta();{const m=modal;modal=null;showSettings();modal=m;}break;
    case'tSfx':cfg.sfx=!cfg.sfx;applyCfg();{const m=modal;modal=null;showSettings();modal=m;}break;
    case'tDev':cfg.dev=!cfg.dev;if(!cfg.dev)dbgOn=false;applyCfg();{const m=modal;modal=null;showSettings();modal=m;}break;
  }
});
let lpTimer=0,lpFired=false,lpXY=null;
ov.addEventListener('pointerdown',e=>{const g=e.target.closest&&e.target.closest('.mnode');if(!g||!run)return;lpFired=false;lpXY=[e.clientX,e.clientY];clearTimeout(lpTimer);
  lpTimer=setTimeout(()=>{lpFired=true;sfx.select();showNodeInfo(g.dataset.type,!!g.dataset.mid);},480);});
ov.addEventListener('pointermove',e=>{if(lpXY&&Math.hypot(e.clientX-lpXY[0],e.clientY-lpXY[1])>8){clearTimeout(lpTimer);lpXY=null;}});
ov.addEventListener('pointerup',()=>{clearTimeout(lpTimer);lpXY=null;setTimeout(()=>{lpFired=false;},400);});
ov.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.mnode'))e.preventDefault();});
ov.addEventListener('keydown',e=>{const g=e.target.closest&&e.target.closest('g[data-act]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();g.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.getElementById('dbg').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b||b.disabled)return;if(b.dataset.d==='more'){document.getElementById('dbg').classList.toggle('open');dbgLast.dyn='';dbgRender();return;}dbgAction(b.dataset.d,b.dataset.x);});

// ============ INPUT ============
function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function updAim(p){let a=Math.atan2(p.y-LY,p.x-LX);if(p.y<LY)a=p.x<LX?Math.PI-0.12:0.12;aimAng=clamp(a,0.12,Math.PI-0.12);}
cv.addEventListener('pointerdown',e=>{audioInit();const p=toLogical(e);if(state==='menu'&&p.x>hero.x-40&&p.x<hero.x+50&&p.y>GROUND-100&&p.y<GROUND+8){heroTalk();return;}if(player&&run&&p.y>=BH-4&&p.y<=BT+4&&p.x<hudInfoX+20&&!['menu','mapview','clear'].includes(state)){showInfo();return;}if(state!=='aim')return;if(p.y<BT-10)return;aiming=true;updAim(p);try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{if(state!=='aim')return;const p=toLogical(e);if(aiming||(e.pointerType==='mouse'&&p.y>BT-10))updAim(p);});
cv.addEventListener('pointerup',()=>{if(aiming&&state==='aim')fire();aiming=false;});
cv.addEventListener('pointercancel',()=>{aiming=false;});
window.addEventListener('keydown',e=>{
  if(ov.classList.contains('show'))return;
  if(e.code==='ArrowLeft'){aimAng=clamp(aimAng+0.03,0.12,Math.PI-0.12);e.preventDefault();}
  if(e.code==='ArrowRight'){aimAng=clamp(aimAng-0.03,0.12,Math.PI-0.12);e.preventDefault();}
  if(e.code==='Space'||e.code==='Enter'){audioInit();fire();e.preventDefault();}
});
document.getElementById('muteBtn').addEventListener('click',()=>{audioInit();if(cfg.bgm&&cfg.sfx)cfg.bgm=false;else if(cfg.sfx)cfg.sfx=false;else{cfg.bgm=true;cfg.sfx=true;}applyCfg();});
window.addEventListener('pointerdown',()=>audioInit(),{once:true});
document.getElementById('helpBtn').addEventListener('click',()=>{audioInit();if(modal)closeModal();else showHelp();});
document.getElementById('setBtn').addEventListener('click',()=>{audioInit();if(modal&&ov.dataset.screen==='settings')closeModal();else{if(modal)closeModal();showSettings();}});
document.getElementById('infoBtn').addEventListener('click',()=>{audioInit();if(modal&&ov.dataset.screen==='info')closeModal();else{if(modal)closeModal();showInfo();}});
document.getElementById('dbgBtn').addEventListener('click',()=>{audioInit();dbgOn=!dbgOn;odds.turnRef=null;odds.on=false;dbgRender();});
window.addEventListener('pagehide',()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(meta));}catch(e){}});

// ============ BOOT ============
loadCfg();makeSprites();makePortraits();showTitle();loadMeta();
let last=performance.now();
let infoHid=null;
function frame(now){const ih=state!=='menu';if(ih!==infoHid){infoHid=ih;document.getElementById('infoBtn').classList.toggle('hide',ih);}const dt=Math.min(0.033,(now-last)/1000);last=now;if(!paused)update(dt);else musicTick();oddsTick();if(dbgOn&&(now-dbgT>200)){dbgT=now;dbgRender();}render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();

</script>
